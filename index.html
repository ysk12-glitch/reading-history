<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>読書履歴</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  background: #f5f5f7;
  color: #222;
}
header {
  background: white;
  padding: 22px 18px 16px;
  border-bottom: 1px solid #ddd;
  position: sticky;
  top: 0;
  z-index: 10;
}
h1 { margin: 0; font-size: 25px; }
.sub { color: #777; font-size: 13px; margin-top: 5px; }
main { max-width: 700px; margin: auto; padding: 16px; }
.card {
  background: white;
  border-radius: 16px;
  padding: 18px;
  margin-bottom: 16px;
  box-shadow: 0 2px 8px rgba(0,0,0,.06);
}
label {
  display: block;
  font-weight: 600;
  margin: 12px 0 6px;
}
input, textarea, select {
  width: 100%;
  padding: 12px;
  border: 1px solid #ccc;
  border-radius: 10px;
  font-size: 16px;
  background: white;
}
textarea { min-height: 90px; resize: vertical; }
button {
  border: 0;
  border-radius: 12px;
  padding: 12px 16px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
}
.primary {
  width: 100%;
  margin-top: 16px;
  background: #222;
  color: white;
}
.book {
  border-top: 1px solid #eee;
  padding: 16px 0;
}
.book:first-child { border-top: 0; padding-top: 0; }
.book-title { font-size: 19px; font-weight: 700; }
.author { color: #666; margin-top: 4px; }
.meta { margin-top: 8px; font-size: 14px; color: #555; }
.stars { font-size: 20px; letter-spacing: 2px; }
.note {
  margin-top: 9px;
  white-space: pre-wrap;
  color: #444;
  line-height: 1.5;
}
.delete {
  margin-top: 10px;
  background: #eee;
  color: #555;
  font-size: 14px;
}
.empty {
  text-align: center;
  color: #888;
  padding: 20px 0 8px;
}
.count {
  font-size: 14px;
  color: #777;
  margin-bottom: 10px;
}
</style>
</head>

<body>
<header>
  <h1>📚 読書履歴</h1>
  <div class="sub">あなたが読んだ本を記録します</div>
</header>

<main>
  <section class="card">
    <h2>📖 本を登録</h2>

    <label for="title">書籍名</label>
    <input id="title" type="text" placeholder="例：嫌われる勇気">

    <label for="author">著者名</label>
    <input id="author" type="text" placeholder="例：岸見一郎・古賀史健">

    <label for="date">読了日</label>
    <input id="date" type="date">

    <label for="rating">評価</label>
    <select id="rating">
      <option value="0">評価なし</option>
      <option value="5">⭐⭐⭐⭐⭐</option>
      <option value="4">⭐⭐⭐⭐</option>
      <option value="3">⭐⭐⭐</option>
      <option value="2">⭐⭐</option>
      <option value="1">⭐</option>
    </select>

    <label for="note">感想・メモ</label>
    <textarea id="note" placeholder="印象に残ったことなど"></textarea>

    <button class="primary" onclick="addBook()">＋ 本を登録する</button>
  </section>

  <section class="card">
    <h2>📚 読書履歴</h2>
    <div id="count" class="count"></div>
    <div id="bookList"></div>
  </section>
</main>

<script>
const STORAGE_KEY = "reading_history_v1";

function getBooks() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
  } catch {
    return [];
  }
}

function saveBooks(books) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(books));
}

function setToday() {
  const d = new Date();
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth() + 1).padStart(2, "0");
  const dd = String(d.getDate()).padStart(2, "0");
  document.getElementById("date").value = `${yyyy}-${mm}-${dd}`;
}

function addBook() {
  const title = document.getElementById("title").value.trim();
  const author = document.getElementById("author").value.trim();
  const date = document.getElementById("date").value;
  const rating = Number(document.getElementById("rating").value);
  const note = document.getElementById("note").value.trim();

  if (!title) {
    alert("書籍名を入力してください。");
    return;
  }

  const books = getBooks();

  books.unshift({
    id: Date.now(),
    title,
    author,
    date,
    rating,
    note
  });

  saveBooks(books);

  document.getElementById("title").value = "";
  document.getElementById("author").value = "";
  document.getElementById("note").value = "";
  document.getElementById("rating").value = "0";
  setToday();

  renderBooks();
  alert("本を登録しました！");
}

function deleteBook(id) {
  if (!confirm("この本を削除しますか？")) return;

  const books = getBooks().filter(book => book.id !== id);
  saveBooks(books);
  renderBooks();
}

function formatDate(date) {
  if (!date) return "読了日未設定";
  const parts = date.split("-");
  return `${parts[0]}年${Number(parts[1])}月${Number(parts[2])}日`;
}

function renderBooks() {
  const books = getBooks();
  const list = document.getElementById("bookList");
  const count = document.getElementById("count");

  count.textContent = `登録冊数：${books.length}冊`;

  if (books.length === 0) {
    list.innerHTML = '<div class="empty">まだ本が登録されていません📖<br>上のフォームから登録してみましょう。</div>';
    return;
  }

  list.innerHTML = books.map(book => {
    const stars = book.rating > 0 ? "⭐".repeat(book.rating) : "評価なし";
    return `
      <div class="book">
        <div class="book-title">${escapeHtml(book.title)}</div>
        <div class="author">${escapeHtml(book.author || "著者名未設定")}</div>
        <div class="meta">📅 ${formatDate(book.date)}</div>
        <div class="stars">${stars}</div>
        ${book.note ? `<div class="note">📝 ${escapeHtml(book.note)}</div>` : ""}
        <button class="delete" onclick="deleteBook(${book.id})">🗑️ この本を削除</button>
      </div>
    `;
  }).join("");
}

function escapeHtml(text) {
  return text
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

setToday();
renderBooks();
</script>
</body>
</html>
