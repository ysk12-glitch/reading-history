*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;background:#100c09;color:#f7ecd8}button,input,select,textarea{font:inherit}button{border:0}.study{min-height:100vh;background:radial-gradient(circle at 50% 0,#55351f 0,#24170f 28%,#110d0a 68%);padding-bottom:100px}.top{position:sticky;top:0;z-index:10;padding:calc(15px + env(safe-area-inset-top)) 18px 14px;background:#130e0bef;backdrop-filter:blur(12px);border-bottom:1px solid #c9985b33}.top h1{font-family:Georgia,"Yu Mincho",serif;text-align:center;font-size:25px;letter-spacing:.08em;margin:0;color:#fff4d8}.top .sub{text-align:center;color:#c8a974;font:12px Georgia,serif;margin-top:3px}.version{position:absolute;right:12px;bottom:5px;font-size:9px;color:#9f825e}.study-main{max-width:700px;margin:auto;padding:18px 14px}.summary{display:flex;justify-content:space-around;background:#1c140f;border:1px solid #b8874d44;border-radius:16px;padding:12px 6px;margin-bottom:14px}.stat{text-align:center}.stat b{display:block;font:21px Georgia,serif;color:#e8c789}.stat span{font-size:10px;color:#aa9479}.library-frame{padding:12px 10px 0;border:8px solid #4b2b18;border-radius:12px;background:linear-gradient(90deg,#3a2114,#704527 9%,#472918 20%,#674021 48%,#412517 80%,#704527 92%,#351e12);box-shadow:inset 0 0 35px #0009,0 14px 30px #0008}.shelf-heading{display:flex;justify-content:space-between;padding:2px 4px 11px;color:#ead4ae}.shelf-row{display:flex;align-items:flex-end;gap:3px;min-height:155px;overflow-x:auto;padding:7px 5px 0;background:radial-gradient(ellipse at top,#6c472a66,#1e110b99 70%)}.spine{position:relative;flex:0 0 34px;height:138px;border:1px solid #21150f;border-bottom:0;border-radius:3px 3px 0 0;padding:7px 4px;color:#f5ead7;background:linear-gradient(90deg,#52392c,#94704f 20%,#79583d 80%,#432d23);box-shadow:inset 2px 0 #fff1,inset -2px 0 #0004,2px 1px 4px #0008;writing-mode:vertical-rl;font-size:11px;font-weight:700;overflow:hidden}.spine:nth-child(4n+2){height:145px;background:linear-gradient(90deg,#263b32,#637765 20%,#485e50 80%,#21342b)}.spine:nth-child(4n+3){height:131px;background:linear-gradient(90deg,#2e3446,#687087 20%,#4e576d 80%,#292e3d)}.spine:nth-child(4n){height:142px;background:linear-gradient(90deg,#694528,#b38251 20%,#93663e 80%,#58371f)}.spine.reading-spine:after{content:'🔖';position:absolute;bottom:5px;left:6px;writing-mode:horizontal-tb}.spine.unread-spine{filter:saturate(.5) brightness(.8)}.plank{height:20px;margin:0 -10px 15px;background:linear-gradient(#a56b3d,#5e361f 50%,#321b10);border-top:2px solid #c18b58;box-shadow:0 7px 10px #0009}.empty{padding:45px 15px;text-align:center;color:#b99d78}.desk{margin-top:16px;padding:15px;background:linear-gradient(135deg,#251810,#17100c);border:1px solid #ad7c4344;border-radius:14px}.desk-title{font-family:Georgia,"Yu Mincho",serif;color:#e8c789;margin-bottom:9px}.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px}.quick button{padding:11px 8px;border-radius:10px;background:#332318;color:#dec59e;border:1px solid #9d744644;font-size:12px}.bottom{position:fixed;z-index:20;bottom:0;left:0;right:0;padding:8px 14px calc(8px + env(safe-area-inset-bottom));background:#120d0aef;backdrop-filter:blur(16px);border-top:1px solid #c9985b33;display:flex;justify-content:center;gap:10px}.bottom button{flex:1;max-width:160px;border-radius:14px;padding:10px 5px;background:transparent;color:#bca78c;font-size:11px}.bottom .add{flex:0 0 62px;height:62px;margin-top:-27px;border-radius:50%;font-size:31px;color:#fff3d6;background:radial-gradient(circle at 35% 30%,#d9aa66,#95612d 65%,#5d361c);border:2px solid #e0b876}.ico{display:block;font-size:20px}.sheet{display:none;position:fixed;inset:0;z-index:40;background:#000a;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:max(10px,env(safe-area-inset-top)) 8px calc(12px + env(safe-area-inset-bottom));scroll-behavior:auto}.sheet.show{display:block}.sheet-card{width:min(700px,100%);margin:0 auto;background:#f7f3eb;color:#29231e;border-radius:22px;padding:14px 18px calc(24px + env(safe-area-inset-bottom));min-height:calc(100dvh - 20px)}.sheet-head{position:sticky;top:0;background:#f7f3ebf5;z-index:3;display:flex;justify-content:space-between;align-items:center;padding:10px 0 12px}.sheet-head h2{margin:0;font-family:Georgia,"Yu Mincho",serif}.close{width:36px;height:36px;border-radius:50%;background:#e8e2d9;font-size:20px}.section{padding:13px 0;border-top:1px solid #e3dcd2}.section:first-of-type{border:0}.sheet label{display:block;font-weight:650;margin:11px 0 5px;font-size:13px}.sheet input,.sheet select,.sheet textarea{width:100%;padding:12px;border:1px solid #d4ccc1;border-radius:11px;background:#fff;font-size:16px}.sheet textarea{min-height:75px}.scan,.primary{width:100%;padding:13px;border-radius:12px;color:#fff;margin-top:7px;font-weight:700}.scan{background:#526b58}.primary{background:#30251d}.search-row{display:flex;gap:7px}.search-row input{flex:1}.search-row button,.external,.stop{border-radius:11px;background:#e9e3da;padding:10px}.external,.stop{width:100%;margin-top:8px}.status{display:none;margin-top:9px;padding:10px;border-radius:10px;font-size:13px}.status.show{display:block}.info{background:#eaf0f8;color:#315e91}.ok{background:#e5f3e8;color:#326344}.error{background:#fae8e8;color:#993f3f}#scannerWrap{display:none;margin-top:10px}#reader{width:100%;background:#111;border-radius:12px;overflow:hidden}.organize-grid{display:grid;gap:8px}.period{display:grid;grid-template-columns:1fr 1fr;gap:7px}.filter-actions{display:flex;gap:7px}.filter-actions button{flex:1;padding:10px;border-radius:10px;background:#e9e3da}.book{border-top:1px solid #e6ded3;padding:14px 0}.book-layout{display:flex;gap:12px}.cover,.cover-placeholder{width:68px;min-width:68px;height:102px;border-radius:6px;background:#e8e3dc}.cover{object-fit:cover}.cover-placeholder{display:flex;align-items:center;justify-content:center;font-size:25px}.book-info{min-width:0;flex:1}.book-title{font-weight:750;font-size:17px}.author,.meta{color:#776e64;font-size:13px;margin-top:4px}.reading-tag{display:inline-block;margin-top:6px;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:700}.reading{background:#fff0d0;color:#855b16}.done{background:#e4f0e7;color:#386248}.unread{background:#e9e9e9;color:#666}.stars,.note{margin-top:6px}.note{font-size:13px;white-space:pre-wrap}.book-actions button{margin:8px 5px 0 0;padding:8px;border-radius:9px;font-size:11px;background:#eae5dd}.edit-panel{margin-top:10px;padding:10px;background:#eee9e2;border-radius:10px}.edit-actions{display:flex;gap:7px;margin-top:8px}.edit-actions button{flex:1;padding:9px;border-radius:9px}.save-edit{background:#30251d!important;color:#fff}.author-shelf{border:1px solid #ddd5ca;border-radius:12px;margin:9px 0;overflow:hidden}.author-head{width:100%;display:flex;justify-content:space-between;padding:12px;background:#eee8df}.author-body{padding:0 12px}.author-body.closed{display:none}.dialog{display:none;position:fixed;inset:0;z-index:60;background:#000b;padding:20px;align-items:center;justify-content:center}.dialog.show{display:flex}.dialog-card{width:min(420px,100%);max-height:84vh;overflow:auto;background:#f8f3e9;color:#29231e;border-radius:18px;padding:17px}.dialog-top{display:flex;gap:13px}.dialog-cover,.dialog-placeholder{width:88px;height:132px;border-radius:6px;background:#e8e3dc}.dialog-cover{object-fit:cover}.dialog-placeholder{display:flex;align-items:center;justify-content:center;font-size:28px}.dialog-close{width:100%;padding:11px;margin-top:14px;border-radius:11px;background:#30251d;color:#fff}

<body><div class="study"><header class="top"><h1>わたしの書斎</h1><div class="sub">Good Books, Better Days</div><span class="version">書斎モード v22.2</span></header><main class="study-main"><div id="summary" class="summary"></div><div class="library-frame"><div class="shelf-heading"><strong>My Library</strong><small id="shelfCaption">すべての本</small></div><div id="studyShelf"></div></div><div class="desk"><div class="desk-title">☕ 書斎のメニュー</div><div class="quick"><button id="thisYearQuick">📅 今年読んだ本</button><button id="readingQuick">🔖 読書中の本</button><button id="allQuick">📚 すべての本</button><button id="organizeQuick">⚙️ 本棚を整理</button></div></div></main><nav class="bottom"><button><span class="ico">▥</span>書斎</button><button id="organizeNav"><span class="ico">⌕</span>整理</button><button class="add" id="openAdd">＋</button><button id="readingNav"><span class="ico">🔖</span>読書中</button><button id="allNav"><span class="ico">☰</span>一覧</button></nav></div>
<div class="sheet" id="addSheet"><div class="sheet-card"><div class="sheet-head"><h2>本を追加する</h2><button class="close" data-close="addSheet">×</button></div><div class="section" id="scanSection"><button class="scan" id="scanButton">📷 本のバーコードを読み取る</button><div id="scannerWrap"><div id="reader"></div><button class="stop" id="stopButton">カメラを閉じる</button></div><label>ISBNを直接入力</label><div class="search-row"><input id="isbn" inputmode="numeric" placeholder="9784478025819"><button id="searchButton">検索</button></div><button class="external" id="lookupIsbnButton">🔎 手元にない本のISBNを調べる</button><div id="status" class="status"></div></div><div class="section"><label>書籍名</label><input id="title"><label>著者名</label><input id="author"><input id="coverUrl" type="hidden"><input id="publisher" type="hidden"><label>読書状況</label><select id="readingStatus"><option value="done">✅ 読了</option><option value="reading">📖 読書中</option><option value="unread">📚 未読・積読</option></select><label>読了日</label><input id="date" type="date"><label>評価</label><select id="rating"><option value="0">評価なし</option><option value="5">⭐⭐⭐⭐⭐</option><option value="4">⭐⭐⭐⭐</option><option value="3">⭐⭐⭐</option><option value="2">⭐⭐</option><option value="1">⭐</option></select><label>感想・メモ</label><textarea id="note"></textarea><button class="primary" id="addButton">＋ 本棚に追加する</button></div></div></div>
<div class="sheet" id="organizeSheet"><div class="sheet-card"><div class="sheet-head"><h2>本棚を整理する</h2><button class="close" data-close="organizeSheet">×</button></div><div class="section organize-grid"><input id="historySearch" placeholder="🔎 タイトル・著者で検索"><select id="viewMode"><option value="author">著者別</option><option value="all">すべての本</option></select><select id="sortMode"><option value="new">読了日：新しい順</option><option value="old">読了日：古い順</option><option value="rating">評価：高い順</option></select><select id="statusFilter"><option value="all">読書状況：すべて</option><option value="reading">📖 読書中だけ</option><option value="unread">📚 未読・積読だけ</option><option value="done">✅ 読了だけ</option></select><label>読了期間</label><div class="period"><input id="periodFrom" type="date"><input id="periodTo" type="date"></div><div class="filter-actions"><button id="thisYearButton">今年</button><button id="clearPeriodButton">条件を解除</button></div></div><div id="count" class="meta"></div><div id="bookList"></div></div></div><input id="coverFileInput" type="file" accept="image/*" hidden><div class="dialog" id="bookDialog"><div class="dialog-card" id="bookDialogCard"></div></div>
<script>
const K='reading_history_v1',E=id=>document.getElementById(id);let qr=null,scanning=false,locked=false,manualId=null,editId=null,studyFilter='all';const books=()=>{try{return JSON.parse(localStorage.getItem(K))||[]}catch{return[]}},save=v=>localStorage.setItem(K,JSON.stringify(v)),statusOf=b=>b.status||'done',esc=s=>String(s||'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
function today(){const d=new Date();E('date').value=d.toISOString().slice(0,10)}function norm(v){return String(v||'').replace(/\D/g,'')}function valid(x){if(!/^\d{13}$/.test(x))return false;let s=0;for(let i=0;i<12;i++)s+=+x[i]*(i%2?3:1);return(10-s%10)%10===+x[12]}function msg(t,c='info'){E('status').textContent=t;E('status').className='status show '+c}function cleanAuthor(a){return String(a||'').replace(/,\d{4}-?/g,'').replace(/,/g,'').trim().replace(/\s+/g,'・')}function cleanUrl(u){return String(u||'').replace(/^http:/,'https:').replace(/&edge=curl/g,'')}function exact(item,isbn){return(item?.volumeInfo?.industryIdentifiers||[]).some(x=>norm(x.identifier)===isbn)}function links(item){const x=item?.volumeInfo?.imageLinks||{};return[x.extraLarge,x.large,x.medium,x.small,x.thumbnail,x.smallThumbnail].filter(Boolean).map(cleanUrl)}
function imageWorks(url){return new Promise(r=>{if(!url)return r(false);const i=new Image();let done=false;const f=v=>{if(done)return;done=true;clearTimeout(t);r(v)},t=setTimeout(()=>f(false),5000);i.referrerPolicy='no-referrer';i.onload=()=>f(i.naturalWidth>50&&i.naturalHeight>70);i.onerror=()=>f(false);i.src=url})}
async function googleSearch(q){try{const r=await fetch('https://www.googleapis.com/books/v1/volumes?q='+encodeURIComponent(q)+'&maxResults=20'),d=await r.json();return d.items||[]}catch{return[]}}
function similar(a,b){a=String(a||'').toLowerCase().replace(/[\s　:：・,，。\-―ー「」『』【】\[\]()（）]/g,'');b=String(b||'').toLowerCase().replace(/[\s　:：・,，。\-―ー「」『』【】\[\]()（）]/g,'');return !!a&&!!b&&(a.includes(b)||b.includes(a)||a.slice(0,8)===b.slice(0,8))}
async function metadata(isbn){let items=await googleSearch('isbn:'+isbn);for(const i of items)if(exact(i,isbn)){const v=i.volumeInfo||{};if(v.title)return{title:v.title,author:(v.authors||[]).join('・'),publisher:v.publisher||'',cover:links(i)[0]||''}}return null}
async function cover(isbn,preferred,title,author,publisher){let c=[];if(/ダイヤモンド社/.test(publisher||''))c.push('https://www.diamond.co.jp/images/book/'+isbn.slice(-1)+'/'+isbn+'.jpg');if(preferred)c.push(cleanUrl(preferred));let gi=await googleSearch('isbn:'+isbn);for(const i of gi)if(exact(i,isbn))c.push(...links(i));c.push('https://covers.openlibrary.org/b/isbn/'+isbn+'-L.jpg?default=false');for(const u of [...new Set(c)])if(await imageWorks(u))return u;
// v22.2: ISBN完全一致が無い場合だけ、書名＋著者で候補を探して内容を照合
if(title){const q='intitle:'+title+(author?' inauthor:'+author.split('・')[0]:'');const items=await googleSearch(q);for(const i of items){const v=i.volumeInfo||{};if(!similar(v.title,title))continue;if(author&&v.authors?.length&&!v.authors.some(a=>similar(a,author)||similar(author,a)))continue;for(const u of links(i))if(await imageWorks(u))return u}}
return''}
async function startScanner(){if(scanning)return;msg('カメラを起動しています…');E('scannerWrap').style.display='block';try{qr=new Html5Qrcode('reader',{formatsToSupport:[Html5QrcodeSupportedFormats.EAN_13]});await qr.start({facingMode:'environment'},{fps:10,qrbox:{width:280,height:120}},scanOk,()=>{});scanning=true;locked=false;msg('ISBNバーコードを合わせてください。','ok')}catch{E('scannerWrap').style.display='none';msg('カメラを起動できませんでした。','error')}}async function stopScanner(){if(qr)try{if(scanning)await qr.stop();await qr.clear()}catch{}qr=null;scanning=false;locked=false;E('scannerWrap').style.display='none'}async function scanOk(t){if(locked)return;const x=norm(t);if(!/^(978|979)\d{10}$/.test(x)||!valid(x))return;locked=true;E('isbn').value=x;await stopScanner();lookup(x)}async function searchIsbn(){const x=norm(E('isbn').value);if(!valid(x))return msg('正しい13桁のISBNを入力してください。','error');lookup(x)}
async function lookup(isbn){msg('書籍情報と表紙を探しています…');try{const r=await fetch('https://api.openbd.jp/v1/get?isbn='+isbn),d=await r.json(),s=d?.[0]?.summary;if(s?.title){const a=cleanAuthor(s.author),c=await cover(isbn,s.cover,s.title,a,s.publisher||'');fill(isbn,s.title,a,c,s.publisher||'');msg(c?'書籍情報と表紙を取得しました！':'書籍情報を取得しました。表紙は見つかりませんでした。',c?'ok':'info');return}}catch{}const g=await metadata(isbn);if(g){const a=cleanAuthor(g.author),c=await cover(isbn,g.cover,g.title,a,g.publisher);fill(isbn,g.title,a,c,g.publisher);msg(c?'書籍情報と表紙を取得しました！':'書籍情報を取得しました。表紙は見つかりませんでした。',c?'ok':'info');return}msg('書籍情報を自動取得できませんでした。','error')}function fill(i,t,a,c,p){E('isbn').value=i;E('title').value=t||'';E('author').value=a||'';E('coverUrl').value=c||'';E('publisher').value=p||''}
function addBook(){const t=E('title').value.trim();if(!t)return alert('書籍名を入力してください。');const a=books();a.unshift({id:Date.now(),isbn:norm(E('isbn').value),title:t,author:E('author').value.trim(),publisher:E('publisher').value.trim(),coverUrl:E('coverUrl').value,status:E('readingStatus').value,date:E('date').value,rating:+E('rating').value,note:E('note').value.trim()});save(a);['isbn','title','author','publisher','coverUrl','note'].forEach(x=>E(x).value='');E('readingStatus').value='done';E('rating').value='0';today();render();closeSheet('addSheet');setTimeout(()=>alert('📚 新しい本が書斎に加わりました！'),80)}function del(id){if(confirm('この本を削除しますか？')){save(books().filter(b=>b.id!==id));render()}}
async function refreshCover(id){const a=books(),b=a.find(x=>x.id===id);if(!b)return;msg('表紙を探しています…');b.coverUrl=await cover(b.isbn,'',b.title,b.author,b.publisher||'');save(a);render();msg(b.coverUrl?'表紙を取得しました！':'表紙は見つかりませんでした。',b.coverUrl?'ok':'info')}
function chooseCover(id){manualId=id;E('coverFileInput').value='';E('coverFileInput').click()}function resize(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const s=Math.min(1,500/i.width,750/i.height),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.8))};i.onerror=rej;i.src=r.result};r.readAsDataURL(f)})}async function manual(e){const f=e.target.files?.[0];if(!f||manualId==null)return;const a=books(),b=a.find(x=>x.id===manualId);try{if(b){b.coverUrl=await resize(f);save(a);render()}}catch{}manualId=null}
function stLabel(s){return s==='reading'?'📖 読書中':s==='unread'?'📚 未読・積読':'✅ 読了'}function stClass(s){return s==='reading'?'reading':s==='unread'?'unread':'done'}function fmt(d){if(!d)return'読了日未設定';const p=d.split('-');return p[0]+'年'+(+p[1])+'月'+(+p[2])+'日'}function spine(b){const s=statusOf(b);return'<button class="spine '+(s==='reading'?'reading-spine':s==='unread'?'unread-spine':'')+'" data-book="'+b.id+'">'+esc(b.title)+'</button>'}
function studyBooks(){const a=books(),y=String(new Date().getFullYear());return studyFilter==='reading'?a.filter(b=>statusOf(b)==='reading'):studyFilter==='year'?a.filter(b=>statusOf(b)==='done'&&String(b.date||'').startsWith(y)):a}function renderStudy(){const all=books(),a=studyBooks(),rd=all.filter(b=>statusOf(b)==='reading').length,dn=all.filter(b=>statusOf(b)==='done').length;E('summary').innerHTML='<div class="stat"><b>'+all.length+'</b><span>蔵書</span></div><div class="stat"><b>'+dn+'</b><span>読了</span></div><div class="stat"><b>'+rd+'</b><span>読書中</span></div>';E('shelfCaption').textContent=studyFilter==='year'?new Date().getFullYear()+'年に読んだ本':studyFilter==='reading'?'読書中':'すべての本';if(!a.length)return E('studyShelf').innerHTML='<div class="empty">ここに本が並びます。<br>＋から本を追加して書斎を育てよう。</div>';let h='';for(let i=0;i<a.length;i+=12)h+='<div class="shelf-row">'+a.slice(i,i+12).map(spine).join('')+'</div><div class="plank"></div>';E('studyShelf').innerHTML=h}
function filtered(){const q=E('historySearch').value.toLowerCase(),sf=E('statusFilter').value,f=E('periodFrom').value,t=E('periodTo').value;let a=books().filter(b=>(!q||[b.title,b.author,b.isbn].some(v=>String(v||'').toLowerCase().includes(q)))&&(sf==='all'||statusOf(b)===sf)&&(!f&&!t||statusOf(b)==='done'&&b.date&&(!f||b.date>=f)&&(!t||b.date<=t)));const m=E('sortMode').value;a.sort((x,y)=>m==='rating'?(+y.rating||0)-(+x.rating||0):m==='old'?(x.date||'9999').localeCompare(y.date||'9999'):(y.date||'').localeCompare(x.date||''));return a}
function bookHtml(b){const s=statusOf(b),cv=b.coverUrl?'<img class="cover" src="'+esc(b.coverUrl)+'" referrerpolicy="no-referrer">':'<div class="cover-placeholder">📖</div>';return'<div class="book"><div class="book-layout">'+cv+'<div class="book-info"><div class="book-title">'+esc(b.title)+'</div><div class="author">'+esc(b.author||'著者未設定')+'</div><span class="reading-tag '+stClass(s)+'">'+stLabel(s)+'</span><div class="meta">'+fmt(b.date)+'</div><div class="stars">'+(+b.rating?'⭐'.repeat(+b.rating):'')+'</div>'+(b.note?'<div class="note">'+esc(b.note)+'</div>':'')+'<div class="book-actions"><button onclick="editBook('+b.id+')">✏️ 編集</button><button onclick="refreshCover('+b.id+')">表紙再取得</button><button onclick="chooseCover('+b.id+')">📷 表紙</button><button onclick="del('+b.id+')">削除</button></div>'+editHtml(b)+'</div></div></div>'}function editBook(id){editId=id;renderList()}function editHtml(b){if(editId!==b.id)return'';return'<div class="edit-panel"><label>読書状況</label><select id="es'+b.id+'"><option value="done" '+(statusOf(b)==='done'?'selected':'')+'>✅ 読了</option><option value="reading" '+(statusOf(b)==='reading'?'selected':'')+'>📖 読書中</option><option value="unread" '+(statusOf(b)==='unread'?'selected':'')+'>📚 未読・積読</option></select><label>読了日</label><input id="ed'+b.id+'" type="date" value="'+esc(b.date||'')+'"><label>評価</label><select id="er'+b.id+'">'+[0,5,4,3,2,1].map(n=>'<option value="'+n+'" '+(+b.rating===n?'selected':'')+'>'+(n?'⭐'.repeat(n):'評価なし')+'</option>').join('')+'</select><label>メモ</label><textarea id="en'+b.id+'">'+esc(b.note||'')+'</textarea><div class="edit-actions"><button class="save-edit" onclick="saveEdit('+b.id+')">保存</button><button onclick="editId=null;renderList()">戻る</button></div></div>'}function saveEdit(id){const a=books(),b=a.find(x=>x.id===id);b.status=E('es'+id).value;b.date=E('ed'+id).value;b.rating=+E('er'+id).value;b.note=E('en'+id).value;save(a);editId=null;render()}
function renderList(){const a=filtered();E('count').textContent='表示 '+a.length+'冊';if(!a.length)return E('bookList').innerHTML='<div class="empty" style="color:#777">該当する本がありません。</div>';if(E('viewMode').value==='all')return E('bookList').innerHTML=a.map(bookHtml).join('');const g={};a.forEach(b=>(g[b.author||'著者未設定']??=[]).push(b));E('bookList').innerHTML=Object.keys(g).sort((a,b)=>a.localeCompare(b,'ja')).map((n,i)=>'<div class="author-shelf"><button class="author-head" data-group="g'+i+'"><b>📚 '+esc(n)+'</b><span>'+g[n].length+'冊⌄</span></button><div class="author-body" id="g'+i+'">'+g[n].map(bookHtml).join('')+'</div></div>').join('')}function render(){renderStudy();renderList()}
function showBook(id){const b=books().find(x=>x.id===id);if(!b)return;const s=statusOf(b),cv=b.coverUrl?'<img class="dialog-cover" src="'+esc(b.coverUrl)+'" referrerpolicy="no-referrer">':'<div class="dialog-placeholder">📖</div>';E('bookDialogCard').innerHTML='<div class="dialog-top">'+cv+'<div><div class="book-title">'+esc(b.title)+'</div><div class="author">'+esc(b.author||'著者未設定')+'</div><span class="reading-tag '+stClass(s)+'">'+stLabel(s)+'</span><div class="meta">'+fmt(b.date)+'</div></div></div>'+(b.note?'<div class="note">'+esc(b.note)+'</div>':'')+'<button class="dialog-close" id="dc">書斎に戻る</button>';E('bookDialog').classList.add('show');E('dc').onclick=()=>E('bookDialog').classList.remove('show')}
function openSheet(id){const s=E(id);s.scrollTop=0;s.classList.add('show');requestAnimationFrame(()=>{s.scrollTop=0;if(id==='addSheet')E('scanSection').scrollIntoView({block:'start',behavior:'instant'})})}async function closeSheet(id){if(id==='addSheet'&&scanning)await stopScanner();E(id).classList.remove('show');E(id).scrollTop=0}function setStudy(x){studyFilter=x;renderStudy()}function thisYear(){const y=new Date().getFullYear();E('periodFrom').value=y+'-01-01';E('periodTo').value=y+'-12-31';E('statusFilter').value='done';renderList()}function clearFilters(){E('historySearch').value='';E('statusFilter').value='all';E('periodFrom').value='';E('periodTo').value='';renderList()}function external(){const t=E('title').value.trim();window.open('https://www.google.com/search?q='+encodeURIComponent((t?t+' ':'')+'ISBN'),'_blank','noopener')}
E('openAdd').onclick=()=>openSheet('addSheet');document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>closeSheet(b.dataset.close));E('scanButton').onclick=startScanner;E('stopButton').onclick=stopScanner;E('searchButton').onclick=searchIsbn;E('lookupIsbnButton').onclick=external;E('addButton').onclick=addBook;E('coverFileInput').onchange=manual;['historySearch','viewMode','sortMode','statusFilter','periodFrom','periodTo'].forEach(id=>E(id).addEventListener(id==='historySearch'?'input':'change',renderList));E('thisYearButton').onclick=thisYear;E('clearPeriodButton').onclick=clearFilters;E('thisYearQuick').onclick=()=>setStudy('year');E('readingQuick').onclick=()=>setStudy('reading');E('allQuick').onclick=()=>setStudy('all');E('organizeQuick').onclick=E('organizeNav').onclick=()=>openSheet('organizeSheet');E('readingNav').onclick=()=>setStudy('reading');E('allNav').onclick=()=>openSheet('organizeSheet');E('studyShelf').onclick=e=>{const b=e.target.closest('[data-book]');if(b)showBook(+b.dataset.book)};E('bookList').onclick=e=>{const h=e.target.closest('[data-group]');if(h)E(h.dataset.group)?.classList.toggle('closed')};E('bookDialog').onclick=e=>{if(e.target===E('bookDialog'))E('bookDialog').classList.remove('show')};today();render();
</script></body></html>
