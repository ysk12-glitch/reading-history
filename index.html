<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>読書履歴</title><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;background:#f5f5f7;color:#222}header{background:#fffffff2;padding:22px 18px 16px;border-bottom:1px solid #ddd;position:sticky;top:0;z-index:10;backdrop-filter:blur(12px)}h1{margin:0;font-size:25px}h2{margin-top:0;font-size:21px}.sub,.count,.meta{color:#777;font-size:13px}.sub{margin-top:5px}main{max-width:700px;margin:auto;padding:16px 16px max(30px,env(safe-area-inset-bottom))}.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 2px 8px #0000000f}label{display:block;font-weight:600;margin:12px 0 6px}input,textarea,select{width:100%;padding:12px;border:1px solid #ccc;border-radius:10px;font-size:16px;background:#fff}textarea{min-height:90px}button{border:0;border-radius:12px;padding:13px 16px;font-size:16px;font-weight:650}.primary,.scan-button,.stop-button{width:100%;margin-top:10px}.primary{background:#222;color:#fff}.scan-button{background:#2f6fed;color:#fff}.stop-button,.delete{background:#eee}.search-row{display:flex;gap:8px}.search-row input{flex:1}.search-row button,.retry-cover{background:#eef4ff;color:#2457b8}.badge{display:inline-block;font-size:12px;background:#eef4ff;color:#2457b8;border-radius:999px;padding:5px 9px;margin-bottom:12px}#scannerWrap{display:none;margin-top:14px}#reader{width:100%;background:#111;border-radius:14px;overflow:hidden}.status{display:none;margin-top:12px;padding:11px;border-radius:10px;font-size:14px;line-height:1.5}.status.show{display:block}.info{background:#eef4ff;color:#2457b8}.ok{background:#edf8f0;color:#23663a}.error{background:#fff0f0;color:#a23636}.book{border-top:1px solid #eee;padding:16px 0}.book:first-child{border-top:0}.book-layout{display:flex;gap:13px}.cover,.cover-placeholder{width:72px;min-width:72px;height:108px;border-radius:7px;background:#eee}.cover{object-fit:cover}.cover-placeholder{display:flex;align-items:center;justify-content:center;font-size:27px}.book-info{min-width:0;flex:1}.book-title{font-size:18px;font-weight:700;line-height:1.35}.author{color:#666;margin-top:4px}.meta{margin-top:7px}.stars{margin-top:4px;font-size:18px}.note{margin-top:10px;white-space:pre-wrap;font-size:14px}.delete,.retry-cover,.manual-cover{margin-top:10px;font-size:13px;padding:9px 12px}.retry-cover,.manual-cover{margin-right:7px}.manual-cover{background:#edf8f0;color:#23663a}.empty{text-align:center;color:#888;padding:20px}.count{margin-bottom:10px}
</style></head><body><header><h1>📚 読書履歴</h1><div class="sub">本のISBNを読み取って、かんたん登録</div></header><main>
<section class="card"><h2>📷 ISBNから自動入力</h2><div class="badge">表紙取得 v14</div><button class="scan-button" id="scanButton">📷 本のバーコードを読み取る</button><div id="scannerWrap"><div id="reader"></div><button class="stop-button" id="stopButton">カメラを閉じる</button></div><label>ISBNを直接入力して検索</label><div class="search-row"><input id="isbn" inputmode="numeric" placeholder="例：9784478025819"><button id="searchButton">検索</button></div><div id="status" class="status"></div></section>
<section class="card"><h2>📖 本を登録</h2><label>書籍名</label><input id="title"><label>著者名</label><input id="author"><input id="coverUrl" type="hidden"><input id="publisher" type="hidden"><label>読了日</label><input id="date" type="date"><label>評価</label><select id="rating"><option value="0">評価なし</option><option value="5">⭐⭐⭐⭐⭐</option><option value="4">⭐⭐⭐⭐</option><option value="3">⭐⭐⭐</option><option value="2">⭐⭐</option><option value="1">⭐</option></select><label>感想・メモ</label><textarea id="note"></textarea><button class="primary" id="addButton">＋ 本を登録する</button></section>
<section class="card"><h2>📚 読書履歴</h2><div id="count" class="count"></div><div id="bookList"></div></section><input id="coverFileInput" type="file" accept="image/*" hidden></main><script>
const STORAGE_KEY='reading_history_v1';let html5QrCode=null,scanning=false,scanLocked=false,manualCoverBookId=null;const el=id=>document.getElementById(id);const getBooks=()=>{try{return JSON.parse(localStorage.getItem(STORAGE_KEY))||[]}catch{return[]}};const saveBooks=v=>localStorage.setItem(STORAGE_KEY,JSON.stringify(v));
function setToday(){const d=new Date();el('date').value=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function normalizeIsbn(v){return String(v||'').replace(/[^0-9Xx]/g,'').toUpperCase()}function isValidIsbn13(x){if(!/^\d{13}$/.test(x))return false;let s=0;for(let i=0;i<12;i++)s+=+x[i]*(i%2?3:1);return(10-s%10)%10===+x[12]}function showStatus(m,t='info'){const s=el('status');s.textContent=m;s.className='status show '+t}function cleanAuthor(a){return String(a||'').replace(/,\d{4}-?/g,'').replace(/,/g,'').trim().replace(/\s+/g,'・')}function cleanUrl(u){return String(u||'').replace(/^http:/,'https:').replace(/&edge=curl/g,'')}
function shortTitle(t){return String(t||'').replace(/^【[^】]+】\s*/,'').split(/[：:―—–]/)[0].trim()}function firstAuthor(a){return String(a||'').split(/[・,、]/)[0].trim()}function itemIsExactIsbn(item,isbn){return(item?.volumeInfo?.industryIdentifiers||[]).some(x=>normalizeIsbn(x.identifier)===isbn)}function imageWorks(url){return new Promise(resolve=>{if(!url)return resolve(false);let done=false;const img=new Image(),finish=v=>{if(done)return;done=true;clearTimeout(timer);img.onload=img.onerror=null;resolve(v)},timer=setTimeout(()=>finish(false),6000);img.referrerPolicy='no-referrer';img.onload=()=>finish(img.naturalWidth>1&&img.naturalHeight>1);img.onerror=()=>finish(false);img.src=url})}
function itemCoverUrls(item){const l=item?.volumeInfo?.imageLinks||{};return[l.extraLarge,l.large,l.medium,l.small,l.thumbnail,l.smallThumbnail].filter(Boolean).map(cleanUrl)}
function japaneseIsbnCandidates(isbn,publisher){const out=[];if(!isbn)return out;const p=String(publisher||'');if(/ダイヤモンド社/.test(p))out.push('https://www.diamond.co.jp/images/book/'+isbn.slice(-1)+'/'+isbn+'.jpg');out.push('https://img.hanmoto.com/bd/img/'+isbn+'_600.jpg');return out}
async function googleExact(isbn){const out=[];for(const url of['https://www.googleapis.com/books/v1/volumes?q=isbn:'+isbn+'&langRestrict=ja&maxResults=20','https://www.googleapis.com/books/v1/volumes?q=isbn:'+isbn+'&maxResults=20'])try{const r=await fetch(url),d=await r.json();for(const i of d.items||[])if(itemIsExactIsbn(i,isbn))out.push(...itemCoverUrls(i))}catch{}return[...new Set(out)]}
async function googleTitle(title,author){const out=[],st=shortTitle(title),fa=firstAuthor(author);if(!st)return out;for(const q of['intitle:'+st+(fa?' inauthor:'+fa:''),st+(fa?' '+fa:'')])try{const r=await fetch('https://www.googleapis.com/books/v1/volumes?q='+encodeURIComponent(q)+'&langRestrict=ja&maxResults=20'),d=await r.json();for(const i of d.items||[])if(String(i?.volumeInfo?.language||'').toLowerCase()==='ja')out.push(...itemCoverUrls(i))}catch{}return out}
async function googleMetadata(isbn){for(const url of['https://www.googleapis.com/books/v1/volumes?q=isbn:'+isbn+'&langRestrict=ja&maxResults=20','https://www.googleapis.com/books/v1/volumes?q=isbn:'+isbn+'&maxResults=20'])try{const r=await fetch(url),d=await r.json();for(const i of d.items||[]){if(!itemIsExactIsbn(i,isbn))continue;const v=i.volumeInfo||{};if(v.title)return{title:v.title,author:(v.authors||[]).join('・'),publisher:v.publisher||'',cover:itemCoverUrls(i)[0]||''}}}catch{}return null}
async function openLibrary(isbn){const out=[];try{const r=await fetch('https://openlibrary.org/search.json?isbn='+isbn+'&fields=cover_i,isbn&limit=10'),d=await r.json();for(const x of d.docs||[]){if(!(x.isbn||[]).some(v=>normalizeIsbn(v)===isbn))continue;if(x.cover_i)out.push('https://covers.openlibrary.org/b/id/'+x.cover_i+'-L.jpg?default=false')}}catch{}return out}
async function findCover(isbn,preferred,title,author,publisher){let c=[...japaneseIsbnCandidates(isbn,publisher)];if(preferred)c.push(cleanUrl(preferred));c.push(...await googleExact(isbn));c.push(...await googleTitle(title,author));c.push(...await openLibrary(isbn));c=[...new Set(c.filter(Boolean))];for(const u of c)if(await imageWorks(u))return u;return''}
async function startScanner(){if(scanning)return;showStatus('カメラを起動しています…');el('scannerWrap').style.display='block';try{html5QrCode=new Html5Qrcode('reader',{formatsToSupport:[Html5QrcodeSupportedFormats.EAN_13]});await html5QrCode.start({facingMode:'environment'},{fps:10,qrbox:{width:280,height:120}},onScanSuccess,()=>{});scanning=true;scanLocked=false;showStatus('カメラ起動OK！ISBNバーコードを合わせてください。','ok')}catch{scanning=false;el('scannerWrap').style.display='none';showStatus('カメラを起動できませんでした。','error')}}async function stopScanner(){if(html5QrCode)try{if(scanning)await html5QrCode.stop();await html5QrCode.clear()}catch{}html5QrCode=null;scanning=false;scanLocked=false;el('scannerWrap').style.display='none'}async function onScanSuccess(text){if(scanLocked)return;const isbn=normalizeIsbn(text);if(!/^(978|979)\d{10}$/.test(isbn)||!isValidIsbn13(isbn))return;scanLocked=true;el('isbn').value=isbn;await stopScanner();await lookupBook(isbn)}async function searchByIsbn(){const isbn=normalizeIsbn(el('isbn').value);el('isbn').value=isbn;if(!isValidIsbn13(isbn))return showStatus('正しい13桁のISBNを入力してください。','error');await lookupBook(isbn)}
async function lookupBook(isbn){showStatus('日本版を優先して書籍情報と表紙を探しています…');try{const r=await fetch('https://api.openbd.jp/v1/get?isbn='+isbn),d=await r.json(),b=d?.[0];if(b?.summary?.title){const s=b.summary,a=cleanAuthor(s.author),p=s.publisher||'',c=await findCover(isbn,s.cover,s.title,a,p);fillBookInfo(isbn,s.title,a,c,p);showStatus(c?'日本版の書籍情報と表紙を取得しました！':'日本版の書籍情報を取得しました。表紙は見つかりませんでした。',c?'ok':'info');return}}catch{}const g=await googleMetadata(isbn);if(g){const a=cleanAuthor(g.author),c=await findCover(isbn,g.cover,g.title,a,g.publisher);fillBookInfo(isbn,g.title,a,c,g.publisher);showStatus(c?'Google Booksから書籍情報と表紙を取得しました！':'Google Booksから書籍情報を取得しました。表紙は見つかりませんでした。',c?'ok':'info');return}showStatus('書籍情報を自動取得できませんでした。','error')}function fillBookInfo(i,t,a,c,p){el('isbn').value=i;el('title').value=t||'';el('author').value=a||'';el('coverUrl').value=c||'';el('publisher').value=p||''}
function addBook(){const title=el('title').value.trim();if(!title)return alert('書籍名を入力してください。');const books=getBooks();books.unshift({id:Date.now(),isbn:normalizeIsbn(el('isbn').value),title,author:el('author').value.trim(),publisher:el('publisher').value.trim(),date:el('date').value,rating:+el('rating').value,note:el('note').value.trim(),coverUrl:el('coverUrl').value});saveBooks(books);el('isbn').value=el('title').value=el('author').value=el('note').value=el('coverUrl').value=el('publisher').value='';el('rating').value='0';setToday();renderBooks();showStatus('本を登録しました！','ok')}function deleteBook(id){if(confirm('この本を削除しますか？')){saveBooks(getBooks().filter(b=>b.id!==id));renderBooks()}}async function getPublisher(b){if(b.publisher)return b.publisher;try{const r=await fetch('https://api.openbd.jp/v1/get?isbn='+b.isbn),d=await r.json();return d?.[0]?.summary?.publisher||''}catch{return''}}async function refreshCover(id){const books=getBooks(),b=books.find(x=>x.id===id);if(!b)return;showStatus('日本版の表紙を探しています…');b.publisher=await getPublisher(b);const c=await findCover(b.isbn,'',b.title,b.author,b.publisher);b.coverUrl=c;saveBooks(books);renderBooks();showStatus(c?'日本版の表紙を取得しました！':'日本版の表紙は見つかりませんでした。',c?'ok':'info')}
function chooseManualCover(id){manualCoverBookId=id;el('coverFileInput').value='';el('coverFileInput').click()}function resizeImageFile(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const scale=Math.min(1,500/img.width,750/img.height),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.8))};img.onerror=rej;img.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}async function handleManualCoverFile(e){const f=e.target.files?.[0];if(!f||manualCoverBookId==null)return;try{const data=await resizeImageFile(f),books=getBooks(),b=books.find(x=>x.id===manualCoverBookId);if(b){b.coverUrl=data;saveBooks(books);renderBooks();showStatus('表紙を設定しました！','ok')}}catch{showStatus('画像を保存できませんでした。','error')}manualCoverBookId=null}
function esc(t){return String(t||'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}function formatDate(d){if(!d)return'読了日未設定';const p=d.split('-');return p[0]+'年'+Number(p[1])+'月'+Number(p[2])+'日'}function coverHtml(b){return b.coverUrl?'<img class="cover" referrerpolicy="no-referrer" src="'+esc(b.coverUrl)+'" alt="表紙" onerror="this.outerHTML=\'<div class=&quot;cover-placeholder&quot;>📖</div>\'">':'<div class="cover-placeholder">📖</div>'}function renderBooks(){const books=getBooks();el('count').textContent='登録冊数：'+books.length+'冊';if(!books.length)return el('bookList').innerHTML='<div class="empty">まだ本が登録されていません📖</div>';el('bookList').innerHTML=books.map(b=>'<div class="book"><div class="book-layout">'+coverHtml(b)+'<div class="book-info"><div class="book-title">'+esc(b.title)+'</div><div class="author">'+esc(b.author||'著者名未設定')+'</div><div class="meta">📅 '+formatDate(b.date)+'</div>'+(b.isbn?'<div class="meta">ISBN：'+esc(b.isbn)+'</div>':'')+'<div class="stars">'+(+b.rating?'⭐'.repeat(+b.rating):'評価なし')+'</div></div></div>'+(b.note?'<div class="note">📝 '+esc(b.note)+'</div>':'')+'<button class="manual-cover" onclick="chooseManualCover('+b.id+')">📷 写真から表紙を設定</button>'+(b.isbn?'<button class="retry-cover" onclick="refreshCover('+b.id+')">🖼️ 日本版を再取得</button>':'')+'<button class="delete" onclick="deleteBook('+b.id+')">🗑️ この本を削除</button></div>').join('')}
el('scanButton').onclick=startScanner;el('stopButton').onclick=stopScanner;el('searchButton').onclick=searchByIsbn;el('addButton').onclick=addBook;el('coverFileInput').onchange=handleManualCoverFile;setToday();renderBooks();
</script></body></html>
