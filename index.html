<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>わたしの書斎</title><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}body{background:#0d0907;color:#f7ecd8}button,input,select,textarea{font:inherit}button{border:0}.study{min-height:100vh;padding-bottom:100px;background:radial-gradient(circle at 50% -10%,#5c3820,#25170f 28%,#100b08 63%,#080605)}.top{position:sticky;top:0;z-index:20;padding:calc(14px + env(safe-area-inset-top)) 16px 13px;background:#100b08e8;backdrop-filter:blur(16px);border-bottom:1px solid #d09b5b2f}.top h1{margin:0;text-align:center;font:700 25px Georgia,"Yu Mincho",serif;letter-spacing:.07em;color:#fff3d5}.sub{text-align:center;color:#caa974;font:12px Georgia,serif;margin-top:3px}.version{position:absolute;right:10px;bottom:4px;font-size:9px;color:#987b58}.main{max-width:760px;margin:auto;padding:16px 12px}.summary{display:flex;justify-content:space-around;margin-bottom:13px;padding:10px 5px;border:1px solid #c28b4d38;border-radius:15px;background:linear-gradient(#21160f,#17100c)}.stat{text-align:center}.stat b{display:block;color:#e8c585;font:22px Georgia,serif}.stat span{font-size:10px;color:#ad9678}.reading-desk{margin:0 0 15px;padding:12px;border-radius:15px;border:1px solid #a8733d55;background:linear-gradient(145deg,#3a2315,#1d120d);box-shadow:inset 0 1px #fff1,0 10px 24px #0007}.desk-head{display:flex;justify-content:space-between;align-items:center;color:#e8c789;font:700 14px Georgia,"Yu Mincho",serif}.desk-books{display:flex;gap:10px;overflow-x:auto;padding:12px 3px 3px}.desk-book{flex:0 0 82px;background:transparent;color:#eee;padding:0}.desk-book img,.desk-fake{width:82px;height:123px;object-fit:cover;border-radius:4px;box-shadow:7px 8px 14px #000a;transform:perspective(500px ace-between;align-items:center;padding:10px 0 12px;background:#f7f3ebf5}.sheet-head h2{margin:0;font-family:Georgia,"Yu Mincho",serif}.close{width:36px;height:36px;border-radius:50%;background:#e8e2d9;font-size:20px}.section{padding:13px 0;border-top:1px solid #e3dcd2}.section:first-of-type{border:0}.card label{display:block;font-weight:650;margin:11px 0 5px;font-size:13px}.card input,.card select,.card textarea{width:100%;padding:12px;border:1px solid #d4ccc1;border-radius:11px;background:#fff;font-size:16px}.card textarea{min-height:75px}.scan,.primary{width:100%;padding:13px;border-radius:12px;color:#fff;margin-top:7px;font-weight:700}.scan{background:#526b58}.primary{background:#30251d}.row{display:flex;gap:7px}.row input{flex:1}.row button,.external,.stop{border-radius:11px;background:#e9e3da;padding:10px}.external,.stop{width:100%;margin-top:8px}.status{display:none;margin-top:9px;padding:10px;border-radius:10px;font-size:13px}.status.show{display:block}.info{display:block;background:#eaf0f8;color:#315e91}.ok{display:block;background:#e5f3e8;color:#326344}.error{display:block;background:#fae8e8;color:#993f3f}#scannerWrap{display:none;margin-top:10px}#reader{width:100%;background:#111;border-radius:12px;overflow:hidden}.book{border-top:1px solid #e6ded3;padding:14px 0}.book-layout{display:flex;gap:12px}.cover,.placeholder{width:68px;min-width:68px;height:102px;border-radius:6px;background:#e8e3dc}.cover{object-fit:cover}.placeholder{display:flex;align-items:center;justify-content:center;font-size:25px}.book-info{min-width:0;flex:1}.book-title{font-weight:750}.author,.meta{color:#776e64;font-size:12px;margin-top:4px}.tag{display:inline-block;margin-top:6px;padding:4px 8px;border-radius:99px;font-size:11px;background:#e4f0e7;color:#386248}.tag.reading{background:#fff0d0;color:#855b16}.tag.unread{background:#e9e9e9;color:#666}.actions button{margin:8px 5px 0 0;padding:8px;border-radius:9px;background:#eae5dd;font-size:11px}.report-hero{text-align:center;padding:18px;border-radius:16px;background:linear-gradient(145deg,#2d1c12,#56351f);color:#f7e3bd}.report-hero b{display:block;font:42px Georgia,serif}.report-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.report-box{padding:14px;border-radius:12px;background:#eee7dd;text-align:center}.report-box b{display:block;font-size:20px}.month-row{display:grid;grid-template-columns:42px 1fr 28px;gap:8px;align-items:center;margin:7px 0;font-size:12px}.bar{height:9px;border-radius:9px;background:#e2d8ca;overflow:hidden}.bar i{display:block;height:100%;background:#7b5a3a;border-radius:9px}.report-covers{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:10px}.report-covers img,.report-mini{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:3px}.report-mini{display:flex;align-items:center;justify-content:center;background:#c9b397;font-size:7px;padding:3px;text-align:center}.dialog{display:none;position:fixed;inset:0;z-index:60;background:#000b;padding:20px;align-items:center;justify-content:center}.dialog.show{display:flex}.dialog-card{width:min(420px,100%);max-height:84vh;overflow:auto;background:#f8f3e9;color:#29231e;border-radius:18px;padding:17px}.dialog-cover{width:88px;height:132px;object-fit:cover;border-radius:5px}.dialog-top{display:flex;gap:13px}.dialog-close{width:100%;padding:11px;margin-top:14px;border-radius:11px;background:#30251d;color:#fff}</style></head><body><div class="study"><header class="top"><h1>わたしの書斎</h1><div class="sub">本と過ごす、ちょっと豊かな時間。</div><span class="version">書斎 v24</span></header><main class="main"><div id="summary" class="summary"></div><section class="reading-desk"><div class="desk-head"><span>☕ 今読んでいる本</span><small id="deskCount"></small></div><div id="deskBooks" class="desk-books"></div></section><div class="library-stage"><div id="track" class="track"></div><div class="pager"><button id="prev">‹</button><div id="dots" class="dots"></div><button id="next">›</button></div></div><div class="menu"><div class="menu-title">書斎のメニュー</div><div class="quick"><button id="yearShelf">📅 今年読んだ本</button><button id="allShelf">📚 すべての本</button><button id="reportBtn">📊 年間レポート</button><button id="organizeBtn">⚙️ 本棚を整理</button></div></div></main><nav class="bottom"><button><span class="ico">▥</span>書斎</button><button id="organizeNav"><span class="ico">⌕</span>整理</button><button class="add" id="openAdd">＋</button><button id="reportNav"><span class="ico">📊</span>記録</button><button id="listNav"><span class="ico">☰</span>一覧</button></nav></div><div class="sheet" id="addSheet"><div class="card"><div class="sheet-head"><h2>本を追加する</h2><button class="close" data-close="addSheet">×</button></div><div class="section"><button class="scan" id="scanButton">📷 本のバーコードを読み取る</button><div id="scannerWrap"><div id="reader"></div><button class="stop" id="stopButton">カメラを閉じる</button></div><label>ISBNを直接入力</label><div class="row"><input id="isbn" inputmode="numeric"><button id="searchButton">検索</button></div><button class="external" id="externalBtn">🔎 手元にない本のISBNを調べる</button><div id="status" class="status"></div></div><div class="section"><label>書籍名</label><input id="title"><label>著者名</label><input id="author"><input id="publisher" type="hidden"><input id="coverUrl" type="hidden"><label>読書状況</label><select id="readingStatus"><option value="done">✅ 読了</option><option value="reading">📖 読書中</option><option value="unread">📚 未読・積読</option></select><label>読了日</label><input id="date" type="date"><label>評価</label><select id="rating"><option value="0">評価なし</option><option value="5">⭐⭐⭐⭐⭐</option><option value="4">⭐⭐⭐⭐</option><option value="3">⭐⭐⭐</option><option value="2">⭐⭐</option><option value="1">⭐</option></select><label>感想・メモ</label><textarea id="note"></textarea><button class="primary" id="addButton">＋ 本棚に追加する</button></div></div></div><div class="sheet" id="organizeSheet"><div class="card"><div class="sheet-head"><h2>本棚を整理する</h2><button class="close" data-close="organizeSheet">×</button></div><div class="section"><input id="historySearch" placeholder="🔎 タイトル・著者で検索"><label>表示</label><select id="statusFilter"><option value="all">すべて</option><option value="reading">📖 読書中</option><option value="unread">📚 未読</option><option value="done">✅ 読了</option></select></div><div id="bookList"></div></div></div><div class="sheet" id="reportSheet"><div class="card"><div class="sheet-head"><h2>年間読書レポート</h2><button class="close" data-close="reportSheet">×</button></div><div class="section"><select id="reportYear"></select><div id="reportBody"></div></div></div></div><input id="coverFileInput" type="file" accept="image/*" hidden><div class="dialog" id="bookDialog"><div class="dialog-card" id="dialogCard"></div></div><script>const K='reading_history_v1',E=id=>document.getElementById(id);let qr=null,scanning=false,locked=false,manualId=null,currentShelf=0,studyFilter='all';const books=()=>{try{return JSON.parse(localStorage.getItem(K))||[]}catch{return[]}},save=a=>localStorage.setItem(K,JSON.stringify(a)),statusOf=b=>b.status||'done',esc=s=>String(s||'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');function today(){E('date').value=new Date().toISOString().slice(0,10)}function norm(v){return String(v||'').replace(/\D/g,'')}function valid(x){if(!/^\d{13}$/.test(x))return false;let s=0;for(let i=0;i<12;i++)s+=+x[i]*(i%2?3:1);return(10-s%10)%10===+x[12]}function msg(t,c='info'){E('status').textContent=t;E('status').className='status '+c}function cleanAuthor(a){return String(a||'').replace(/,\d{4}-?/g,'').replace(/,/g,'').trim().replace(/\s+/g,'・')}function cleanUrl(u){return String(u||'').replace(/^http:/,'https:').replace(/&edge=curl/g,'')}function exact(i,isbn){return(i?.volumeInfo?.industryIdentifiers||[]).some(x=>norm(x.identifier)===isbn)}function links(i){const x=i?.volumeInfo?.imageLinks||{};return[x.extraLarge,x.large,x.medium,x.small,x.thumbnail,x.smallThumbnail].filter(Boolean).map(cleanUrl)}function imageWorks(u){return new Promise(r=>{if(!u)return r(false);const i=new Image();let d=false;const f=v=>{if(d)return;d=true;clearTimeout(t);r(v)},t=setTimeout(()=>f(false),5000);i.onload=()=>f(i.naturalWidth>50&&i.naturalHeight>70);i.onerror=()=>f(false);i.src=u})}async function google(q){try{return(await(await fetch('https://www.googleapis.com/books/v1/volumes?q='+encodeURIComponent(q)+'&maxResults=20')).json()).items||[]}catch{return[]}}function similar(a,b){a=String(a||'').toLowerCase().replace(/[\s　:：・,，。\-―ー「」『』【】]/g,'');b=String(b||'').toLowerCase().replace(/[\s　:：・,，。\-―ー「」『』【】]/g,'');return!!a&&!!b&&(a.includes(b)||b.includes(a)||a.slice(0,8)===b.slice(0,8))}async function findCover(isbn,preferred,title,author,publisher){let c=[];if(isbn)c.push('https://img.hanmoto.com/bd/img/'+isbn+'_600.jpg');if(/ダイヤモンド社/.test(publisher||''))c.push('https://www.diamond.co.jp/images/book/'+isbn.slice(-1)+'/'+isbn+'.jpg');if(preferred)c.push(cleanUrl(preferred));for(const i of await google('isbn:'+isbn))if(exact(i,isbn))c.push(...links(i));if(isbn)c.push('https://covers.openlibrary.org/b/isbn/'+isbn+'-L.jpg?default=false');for(const u of [...new Set(c)])if(await imageWorks(u))return u;if(title)for(const i of await google('intitle:'+title+(author?' inauthor:'+author.split('・')[0]:''))){const v=i.volumeInfo||{};if(similar(v.title,title)){for(const u of links(i))if(await imageWorks(u))return u}}return''}async function lookup(isbn){msg('書籍情報と表紙を探しています…');try{const d=await(await fetch('https://api.openbd.jp/v1/get?isbn='+isbn)).json(),s=d?.[0]?.summary;if(s?.title){const a=cleanAuthor(s.author),c=await findCover(isbn,s.cover,s.title,a,s.publisher||'');fill(isbn,s.title,a,c,s.publisher||'');return msg(c?'書籍情報と表紙を取得しました！':'書籍情報を取得しました。','ok')}}catch{}for(const i of await google('isbn:'+isbn))if(exact(i,isbn)){const v=i.volumeInfo||{},a=(v.authors||[]).join('・'),c=await findCover(isbn,links(i)[0],v.title,a,v.publisher||'');fill(isbn,v.title,a,c,v.publisher||'');return msg('書籍情報を取得しました！','ok')}msg('書籍情報を取得できませんでした。','error')}function fill(i,t,a,c,p){E('isbn').value=i;E('title').value=t||'';E('author').value=a||'';E('coverUrl').value=c||'';E('publisher').value=p||''}async function startScanner(){if(scanning)return;msg('カメラを起動しています…');E('scannerWrap').style.display='block';try{qr=new Html5Qrcode('reader',{formatsToSupport:[Html5QrcodeSupportedFormats.EAN_13]});await qr.start({facingMode:'environment'},{fps:10,qrbox:{width:280,height:120}},async t=>{if(locked)return;const x=norm(t);if(!/^(978|979)\d{10}$/.test(x)||!valid(x))return;locked=true;E('isbn').value=x;await stopScanner();lookup(x)},()=>{});scanning=true;locked=false;msg('ISBNバーコードを合わせてください。','ok')}catch{E('scannerWrap').style.display='none';msg('カメラを起動できませんでした。','error')}}async function stopScanner(){if(qr)try{if(scanning)await qr.stop();await qr.clear()}catch{}qr=null;scanning=false;locked=false;E('scannerWrap').style.display='none'}function addBook(){const t=E('title').value.trim();if(!t)return alert('書籍名を入力してください。');const a=books();a.unshift({id:Date.now(),isbn:norm(E('isbn').value),title:t,author:E('author').value.trim(),publisher:E('publisher').value.trim(),coverUrl:E('coverUrl').value,status:E('readingStatus').value,date:E('date').value,rating:+E('rating').value,note:E('note').value.trim()});save(a);['isbn','title','author','publisher','coverUrl','note'].forEach(x=>E(x).value='');E('readingStatus').value='done';E('rating').value='0';today();render();closeSheet('addSheet')}function shelfBook(b){return'<button class="shelf-cover" data-book="'+b.id+'">'+(b.coverUrl?'<img src="'+esc(b.coverUrl)+'" referrerpolicy="no-referrer">':'<div class="fake">'+esc(b.title)+'</div>')+'</button>'}function studyBooks(){const a=books(),y=String(new Date().getFullYear());return studyFilter==='year'?a.filter(b=>statusOf(b)==='done'&&String(b.date||'').startsWith(y)):a}function renderStudy(){const all=books(),a=studyBooks(),reading=all.filter(b=>statusOf(b)==='reading'),done=all.filter(b=>statusOf(b)==='done').length;E('summary').innerHTML='<div class="stat"><b>'+all.length+'</b><span>蔵書</span></div><div class="stat"><b>'+done+'</b><span>読了</span></div><div class="stat"><b>'+reading.length+'</b><span>読書中</span></div>';E('deskCount').textContent=reading.length+'冊';E('deskBooks').innerHTML=reading.length?reading.map(b=>'<button class="desk-book" data-book="'+b.id+'">'+(b.coverUrl?'<img src="'+esc(b.coverUrl)+'">':'<div class="desk-fake">'+esc(b.title)+'</div>')+'<small>'+esc(b.title)+'</small></button>').join(''):'<div class="desk-empty">読書中にした本が、ここに置かれます 📖</div>';const groups=[];for(let i=0;i<a.length;i+=24)groups.push(a.slice(i,i+24));if(!groups.length)groups.push([]);E('track').innerHTML=groups.map((g,n)=>{let rows='';for(let r=0;r<4;r++){const row=g.slice(r*6,r*6+6);rows+='<div class="tier"><div class="grid">'+row.map(shelfBook).join('')+Array(6-row.length).fill('<div class="empty-slot"></div>').join('')+'</div></div>'}return'<section class="cabinet"><div class="cab-head"><span class="cab-name">本棚 '+(n+1)+'</span><span class="cab-count">'+g.length+' / 24冊</span></div>'+rows+'</section>'}).join('');E('dots').innerHTML=groups.map((_,i)=>'<span class="dot '+(i===currentShelf?'on':'')+'"></span>').join('');setTimeout(()=>scrollShelf(currentShelf,false),0)}function scrollShelf(n,smooth=true){const c=[...E('track').querySelectorAll('.cabinet')];currentShelf=Math.max(0,Math.min(n,c.length-1));c[currentShelf]?.scrollIntoView({behavior:smooth?'smooth':'auto',block:'nearest',inline:'center'});[...E('dots').children].forEach((x,i)=>x.classList.toggle('on',i===currentShelf))}function tag(b){const s=statusOf(b);return'<span class="tag '+s+'">'+(s==='reading'?'📖 読書中':s==='unread'?'📚 未読':'✅ 読了')+'</span>'}function renderList(){const q=E('historySearch').value.toLowerCase(),sf=E('statusFilter').value,a=books().filter(b=>(!q||[b.title,b.author,b.isbn].some(v=>String(v||'').toLowerCase().includes(q)))&&(sf==='all'||statusOf(b)===sf));E('bookList').innerHTML=a.map(b=>'<div class="book"><div class="book-layout">'+(b.coverUrl?'<img class="cover" src="'+esc(b.coverUrl)+'">':'<div class="placeholder">📖</div>')+'<div class="book-info"><div class="book-title">'+esc(b.title)+'</div><div class="author">'+esc(b.author||'著者未設定')+'</div>'+tag(b)+'<div class="meta">'+esc(b.date||'')+' '+(+b.rating?'⭐'.repeat(b.rating):'')+'</div><div class="actions"><button onclick="cycleStatus('+b.id+')">状況変更</button><button onclick="refreshCover('+b.id+')">表紙再取得</button><button onclick="chooseCover('+b.id+')">📷 表紙</button><button onclick="del('+b.id+')">削除</button></div></div></div></div>').join('')}function cycleStatus(id){const a=books(),b=a.find(x=>x.id===id),s=statusOf(b);b.status=s==='done'?'reading':s==='reading'?'unread':'done';if(b.status==='done'&&!b.date)b.date=new Date().toISOString().slice(0,10);save(a);render()}function del(id){if(confirm('この本を削除しますか？')){save(books().filter(b=>b.id!==id));render()}}async function refreshCover(id){const a=books(),b=a.find(x=>x.id===id);b.coverUrl=await findCover(b.isbn,'',b.title,b.author,b.publisher||'');save(a);render()}function chooseCover(id){manualId=id;E('coverFileInput').value='';E('coverFileInput').click()}async function manual(e){const f=e.target.files?.[0];if(!f||manualId==null)return;const data=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const s=Math.min(1,500/i.width,750/i.height),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.8))};i.src=r.result};r.onerror=rej;r.readAsDataURL(f)}),a=books(),b=a.find(x=>x.id===manualId);if(b){b.coverUrl=data;save(a);render()}manualId=null}function showBook(id){const b=books().find(x=>x.id===id);if(!b)return;E('dialogCard').innerHTML='<div class="dialog-top">'+(b.coverUrl?'<img class="dialog-cover" src="'+esc(b.coverUrl)+'">':'')+'<div><div class="book-title">'+esc(b.title)+'</div><div class="author">'+esc(b.author||'')+'</div>'+tag(b)+'<div class="meta">'+esc(b.date||'')+'</div></div></div><p>'+esc(b.note||'')+'</p><button class="dialog-close" id="dialogClose">書斎に戻る</button>';E('bookDialog').classList.add('show');E('dialogClose').onclick=()=>E('bookDialog').classList.remove('show')}function renderReport(){const y=E('reportYear').value,a=books().filter(b=>statusOf(b)==='done'&&String(b.date||'').startsWith(y)),months=Array(12).fill(0);a.forEach(b=>months[+b.date.slice(5,7)-1]++);const rated=a.filter(b=>+b.rating),avg=rated.length?(rated.reduce((s,b)=>s+(+b.rating),0)/rated.length).toFixed(1):'-',authors={};a.forEach(b=>authors[b.author||'著者未設定']=(authors[b.author||'著者未設定']||0)+1);const top=Object.entries(authors).sort((x,z)=>z[1]-x[1])[0]?.[0]||'-',max=Math.max(1,...months);E('reportBody').innerHTML='<div class="report-hero"><span>'+y+'年に読んだ本</span><b>'+a.length+'</b><span>冊</span></div><div class="report-grid"><div class="report-box">平均評価<b>'+avg+'</b></div><div class="report-box">一番読んだ著者<b style="font-size:13px">'+esc(top)+'</b></div></div><h3>月別</h3>'+months.map((n,i)=>'<div class="month-row"><span>'+(i+1)+'月</span><div class="bar"><i style="width:'+(n/max*100)+'%"></i></div><b>'+n+'</b></div>').join('')+'<h3>'+y+'年の本棚</h3><div class="report-covers">'+a.map(b=>b.coverUrl?'<img src="'+esc(b.coverUrl)+'">':'<div class="report-mini">'+esc(b.title)+'</div>').join('')+'</div>'}function openReport(){const ys=[...new Set(books().filter(b=>b.date).map(b=>b.date.slice(0,4)))].sort().reverse(),now=String(new Date().getFullYear());if(!ys.includes(now))ys.unshift(now);E('reportYear').innerHTML=ys.map(y=>'<option>'+y+'</option>').join('');openSheet('reportSheet');renderReport()}function openSheet(id){const s=E(id);s.classList.add('show');s.scrollTop=0}async function closeSheet(id){if(id==='addSheet'&&scanning)await stopScanner();E(id).classList.remove('show')}function render(){renderStudy();renderList()}E('openAdd').onclick=()=>openSheet('addSheet');document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>closeSheet(b.dataset.close));E('scanButton').onclick=startScanner;E('stopButton').onclick=stopScanner;E('searchButton').onclick=()=>{const x=norm(E('isbn').value);valid(x)?lookup(x):msg('正しい13桁のISBNを入力してください。','error')};E('externalBtn').onclick=()=>window.open('https://www.google.com/search?q='+encodeURIComponent((E('title').value||'書籍')+' ISBN'),'_blank');E('addButton').onclick=addBook;E('coverFileInput').onchange=manual;E('historySearch').oninput=renderList;E('statusFilter').onchange=renderList;E('organizeBtn').onclick=E('organizeNav').onclick=E('listNav').onclick=()=>openSheet('organizeSheet');E('reportBtn').onclick=E('reportNav').onclick=openReport;E('reportYear').onchange=renderReport;E('yearShelf').onclick=()=>{studyFilter='year';currentShelf=0;renderStudy()};E('allShelf').onclick=()=>{studyFilter='all';currentShelf=0;renderStudy()};E('prev').onclick=()=>scrollShelf(currentShelf-1);E('next').onclick=()=>scrollShelf(currentShelf+1);E('track').onclick=E('deskBooks').onclick=e=>{const b=e.target.closest('[data-book]');if(b)showBook(+b.dataset.book)};today();render();</script></body></html>
