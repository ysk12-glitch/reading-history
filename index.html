<body>
<div class="study"><header class="top"><h1>わたしの書斎</h1><div class="sub">本と過ごす、ちょっと豊かな時間。</div><span class="version">3D本棚 v23</span></header><main class="study-main"><div id="summary" class="summary"></div><div class="library-stage"><div id="cabinetTrack" class="cabinet-track"></div><div class="pager"><button id="prevShelf">‹</button><div id="shelfDots" class="dots"></div><button id="nextShelf">›</button></div><div class="shelf-hint">1段6冊 × 4段。24冊で次の本棚が右に増えます。横スワイプでも移動できます。</div></div><div class="desk"><div class="desk-title">☕ 書斎のメニュー</div><div class="quick"><button id="thisYearQuick">📅 今年読んだ本</button><button id="readingQuick">🔖 読書中の本</button><button id="allQuick">📚 すべての本</button><button id="organizeQuick">⚙️ 本棚を整理</button></div></div></main><nav class="bottom"><button><span class="ico">▥</span>書斎</button><button id="organizeNav"><span class="ico">⌕</span>整理</button><button class="add" id="openAdd">＋</button><button id="readingNav"><span class="ico">🔖</span>読書中</button><button id="allNav"><span class="ico">☰</span>一覧</button></nav></div>
<div class="sheet" id="addSheet"><div class="sheet-card"><div class="sheet-head"><h2>本を追加する</h2><button class="close" data-close="addSheet">×</button></div><div class="section" id="scanSection"><button class="scan" id="scanButton">📷 本のバーコードを読み取る</button><div id="scannerWrap"><div id="reader"></div><button class="stop" id="stopButton">カメラを閉じる</button></div><label>ISBNを直接入力</label><div class="search-row"><input id="isbn" inputmode="numeric" placeholder="9784478025819"><button id="searchButton">検索</button></div><button class="external" id="lookupIsbnButton">🔎 手元にない本のISBNを調べる</button><div id="status" class="status"></div></div><div class="section"><label>書籍名</label><input id="title"><label>著者名</label><input id="author"><input id="coverUrl" type="hidden"><input id="publisher" type="hidden"><label>読書状況</label><select id="readingStatus"><option value="done">✅ 読了</option><option value="reading">📖 読書中</option><option value="unread">📚 未読・積読</option></select><label>読了日</label><input id="date" type="date"><label>評価</label><select id="rating"><option value="0">評価なし</option><option value="5">⭐⭐⭐⭐⭐</option><option value="4">⭐⭐⭐⭐</option><option value="3">⭐⭐⭐</option><option value="2">⭐⭐</option><option value="1">⭐</option></select><label>感想・メモ</label><textarea id="note"></textarea><button class="primary" id="addButton">＋ 本棚に追加する</button></div></div></div>
<div class="sheet" id="organizeSheet"><div class="sheet-card"><div class="sheet-head"><h2>本棚を整理する</h2><button class="close" data-close="organizeSheet">×</button></div><div class="section organize-grid"><input id="historySearch" placeholder="🔎 タイトル・著者で検索"><select id="viewMode"><option value="author">著者別</option><option value="all">すべての本</option></select><select id="sortMode"><option value="new">読了日：新しい順</option><option value="old">読了日：古い順</option><option value="rating">評価：高い順</option></select><select id="statusFilter"><option value="all">読書状況：すべて</option><option value="reading">📖 読書中だけ</option><option value="unread">📚 未読・積読だけ</option><option value="done">✅ 読了だけ</option></select><label>読了期間</label><div class="period"><input id="periodFrom" type="date"><input id="periodTo" type="date"></div><div class="filter-actions"><button id="thisYearButton">今年</button><button id="clearPeriodButton">条件を解除</button></div></div><div id="count" class="meta"></div><div id="bookList"></div></div></div>
<input id="coverFileInput" type="file" accept="image/*" hidden><div class="dialog" id="bookDialog"><div class="dialog-card" id="bookDialogCard"></div></div>
<script>
const K='reading_history_v1',E=id=>document.getElementById(id);let qr=null,scanning=false,locked=false,manualId=null,editId=null,studyFilter='all',currentShelf=0;const books=()=>{try{return JSON.parse(localStorage.getItem(K))||[]}catch{return[]}},save=v=>localStorage.setItem(K,JSON.stringify(v)),statusOf=b=>b.status||'done',esc=s=>String(s||'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');function today(){const d=new Date();E('date').value=d.toISOString().slice(0,10)}function norm(v){return String(v||'').replace(/\D/g,'')}function valid(x){if(!/^\d{13}$/.test(x))return false;let s=0;for(let i=0;i<12;i++)s+=+x[i]*(i%2?3:1);return(10-s%10)%10===+x[12]}function msg(t,c='info'){E('status').textContent=t;E('status').className='status show '+c}function cleanAuthor(a){return String(a||'').replace(/,\d{4}-?/g,'').replace(/,/g,'').trim().replace(/\s+/g,'・')}function cleanUrl(u){return String(u||'').replace(/^http:/,'https:').replace(/&edge=curl/g,'')}function exact(item,isbn){return(item?.volumeInfo?.industryIdentifiers||[]).some(x=>norm(x.identifier)===isbn)}function links(item){const x=item?.volumeInfo?.imageLinks||{};return[x.extraLarge,x.large,x.medium,x.small,x.thumbnail,x.smallThumbnail].filter(Boolean).map(cleanUrl)}function imageWorks(url){return new Promise(r=>{if(!url)return r(false);const i=new Image();let done=false;const f=v=>{if(done)return;done=true;clearTimeout(t);r(v)},t=setTimeout(()=>f(false),5000);i.referrerPolicy='no-referrer';i.onload=()=>f(i.naturalWidth>50&&i.naturalHeight>70);i.onerror=()=>f(false);i.src=url})}async function googleSearch(q){try{const r=await fetch('https://www.googleapis.com/books/v1/volumes?q='+encodeURIComponent(q)+'&maxResults=20'),d=await r.json();return d.items||[]}catch{return[]}}function similar(a,b){a=String(a||'').toLowerCase().replace(/[\s　:：・,，。\-―ー「」『』【】\[\]()（）]/g,'');b=String(b||'').toLowerCase().replace(/[\s　:：・,，。\-―ー「」『』【】\[\]()（）]/g,'');return!!a&&!!b&&(a.includes(b)||b.includes(a)||a.slice(0,8)===b.slice(0,8))}async function metadata(isbn){const items=await googleSearch('isbn:'+isbn);for(const i of items)if(exact(i,isbn)){const v=i.volumeInfo||{};if(v.title)return{title:v.title,author:(v.authors||[]).join('・'),publisher:v.publisher||'',cover:links(i)[0]||''}}return null}async function cover(isbn,preferred,title,author,publisher){let c=[];if(isbn)c.push('https://img.hanmoto.com/bd/img/'+isbn+'_600.jpg');if(/ダイヤモンド社/.test(publisher||''))c.push('https://www.diamond.co.jp/images/book/'+isbn.slice(-1)+'/'+isbn+'.jpg');if(preferred)c.push(cleanUrl(preferred));const gi=await googleSearch('isbn:'+isbn);for(const i of gi)if(exact(i,isbn))c.push(...links(i));if(isbn)c.push('https://covers.openlibrary.org/b/isbn/'+isbn+'-L.jpg?default=false');for(const u of [...new Set(c)])if(await imageWorks(u))return u;if(title){const items=await googleSearch('intitle:'+title+(author?' inauthor:'+author.split('・')[0]:''));for(const i of items){const v=i.volumeInfo||{};if(!similar(v.title,title))continue;if(author&&v.authors?.length&&!v.authors.some(a=>similar(a,author)||similar(author,a)))continue;for(const u of links(i))if(await imageWorks(u))return u}}return''}
async function startScanner(){if(scanning)return;msg('カメラを起動しています…');E('scannerWrap').style.display='block';try{qr=new Html5Qrcode('reader',{formatsToSupport:[Html5QrcodeSupportedFormats.EAN_13]});await qr.start({facingMode:'environment'},{fps:10,qrbox:{width:280,height:120}},scanOk,()=>{});scanning=true;locked=false;msg('ISBNバーコードを合わせてください。','ok')}catch{E('scannerWrap').style.display='none';msg('カメラを起動できませんでした。','error')}}async function stopScanner(){if(qr)try{if(scanning)await qr.stop();await qr.clear()}catch{}qr=null;scanning=false;locked=false;E('scannerWrap').style.display='none'}async function scanOk(t){if(locked)return;const x=norm(t);if(!/^(978|979)\d{10}$/.test(x)||!valid(x))return;locked=true;E('isbn').value=x;await stopScanner();lookup(x)}async function searchIsbn(){const x=norm(E('isbn').value);if(!valid(x))return msg('正しい13桁のISBNを入力してください。','error');lookup(x)}async function lookup(isbn){msg('書籍情報と表紙を探しています…');try{const r=await fetch('https://api.openbd.jp/v1/get?isbn='+isbn),d=await r.json(),s=d?.[0]?.summary;if(s?.title){const a=cleanAuthor(s.author),c=await cover(isbn,s.cover,s.title,a,s.publisher||'');fill(isbn,s.title,a,c,s.publisher||'');msg(c?'書籍情報と表紙を取得しました！':'書籍情報を取得しました。表紙は見つかりませんでした。',c?'ok':'info');return}}catch{}const g=await metadata(isbn);if(g){const a=cleanAuthor(g.author),c=await cover(isbn,g.cover,g.title,a,g.publisher);fill(isbn,g.title,a,c,g.publisher);msg(c?'書籍情報と表紙を取得しました！':'書籍情報を取得しました。表紙は見つかりませんでした。',c?'ok':'info');return}msg('書籍情報を自動取得できませんでした。','error')}function fill(i,t,a,c,p){E('isbn').value=i;E('title').value=t||'';E('author').value=a||'';E('coverUrl').value=c||'';E('publisher').value=p||''}function addBook(){const t=E('title').value.trim();if(!t)return alert('書籍名を入力してください。');const a=books();a.unshift({id:Date.now(),isbn:norm(E('isbn').value),title:t,author:E('author').value.trim(),publisher:E('publisher').value.trim(),coverUrl:E('coverUrl').value,status:E('readingStatus').value,date:E('date').value,rating:+E('rating').value,note:E('note').value.trim()});save(a);['isbn','title','author','publisher','coverUrl','note'].forEach(x=>E(x).value='');E('readingStatus').value='done';E('rating').value='0';today();currentShelf=0;render();closeSheet('addSheet');setTimeout(()=>alert('📚 新しい本が書斎に加わりました！'),80)}function del(id){if(confirm('この本を削除しますか？')){save(books().filter(b=>b.id!==id));render()}}async function refreshCover(id){const a=books(),b=a.find(x=>x.id===id);if(!b)return;msg('表紙を探しています…');b.coverUrl=await cover(b.isbn,'',b.title,b.author,b.publisher||'');save(a);render();msg(b.coverUrl?'表紙を取得しました！':'表紙は見つかりませんでした。',b.coverUrl?'ok':'info')}function chooseCover(id){manualId=id;E('coverFileInput').value='';E('coverFileInput').click()}function resize(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const s=Math.min(1,500/i.width,750/i.height),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.8))};i.onerror=rej;i.src=r.result};r.readAsDataURL(f)})}async function manual(e){const f=e.target.files?.[0];if(!f||manualId==null)return;const a=books(),b=a.find(x=>x.id===manualId);try{if(b){b.coverUrl=await resize(f);save(a);render()}}catch{}manualId=null}function stLabel(s){return s==='reading'?'📖 読書中':s==='unread'?'📚 未読・積読':'✅ 読了'}function stClass(s){return s==='reading'?'reading':s==='unread'?'unread':'done'}function fmt(d){if(!d)return'読了日未設定';const p=d.split('-');return p[0]+'年'+(+p[1])+'月'+(+p[2])+'日'}
function studyBooks(){const a=books(),y=String(new Date().getFullYear());return studyFilter==='reading'?a.filter(b=>statusOf(b)==='reading'):studyFilter==='year'?a.filter(b=>statusOf(b)==='done'&&String(b.date||'').startsWith(y)):a}function shelfCover(b){const s=statusOf(b),cls=s==='reading'?' reading-cover':s==='unread'?' unread-cover':'';const visual=b.coverUrl?'<img src="'+esc(b.coverUrl)+'" alt="'+esc(b.title)+'" referrerpolicy="no-referrer" onerror="this.parentElement.innerHTML=\'<div class=&quot;fake-cover&quot;>'+esc(b.title)+'<\/div>\'">':'<div class="fake-cover">'+esc(b.title)+'</div>';return'<button class="shelf-cover'+cls+'" data-book="'+b.id+'" title="'+esc(b.title)+'">'+visual+'</button>'}function cabinetHtml(items,index,total){let rows='';for(let r=0;r<4;r++){const row=items.slice(r*6,r*6+6);let cells=row.map(shelfCover).join('');for(let x=row.length;x<6;x++)cells+='<div class="shelf-empty"></div>';rows+='<div class="shelf-tier"><div class="cover-grid">'+cells+'</div></div>'}const start=index*24+1,end=index*24+items.length;return'<section class="cabinet" data-cabinet="'+index+'"><div class="cabinet-head"><span class="cabinet-name">本棚 '+(index+1)+'</span><span class="cabinet-count">'+start+' - '+end+' / '+total+'</span></div>'+rows+'</section>'}function renderStudy(){const all=books(),a=studyBooks(),rd=all.filter(b=>statusOf(b)==='reading').length,dn=all.filter(b=>statusOf(b)==='done').length;E('summary').innerHTML='<div class="stat"><b>'+all.length+'</b><span>蔵書</span></div><div class="stat"><b>'+dn+'</b><span>読了</span></div><div class="stat"><b>'+rd+'</b><span>読書中</span></div>';if(!a.length){E('cabinetTrack').innerHTML='<section class="cabinet"><div class="empty">ここに本が並びます。<br>＋から本を追加して書斎を育てよう。</div></section>';E('shelfDots').innerHTML='';return}const groups=[];for(let i=0;i<a.length;i+=24)groups.push(a.slice(i,i+24));if(currentShelf>=groups.length)currentShelf=groups.length-1;E('cabinetTrack').innerHTML=groups.map((g,i)=>cabinetHtml(g,i,a.length)).join('');E('shelfDots').innerHTML=groups.map((_,i)=>'<span class="dot '+(i===currentShelf?'active':'')+'" data-dot="'+i+'"></span>').join('');requestAnimationFrame(()=>scrollShelf(currentShelf,false))}function scrollShelf(i,smooth=true){const track=E('cabinetTrack'),items=[...track.querySelectorAll('.cabinet')];if(!items.length)return;currentShelf=Math.max(0,Math.min(i,items.length-1));items[currentShelf].scrollIntoView({behavior:smooth?'smooth':'auto',block:'nearest',inline:'center'});[...E('shelfDots').children].forEach((d,n)=>d.classList.toggle('active',n===currentShelf))}
function filtered(){const q=E('historySearch').value.toLowerCase(),sf=E('statusFilter').value,f=E('periodFrom').value,t=E('periodTo').value;let a=books().filter(b=>(!q||[b.title,b.author,b.isbn].some(v=>String(v||'').toLowerCase().includes(q)))&&(sf==='all'||statusOf(b)===sf)&&(!f&&!t||statusOf(b)==='done'&&b.date&&(!f||b.date>=f)&&(!t||b.date<=t)));const m=E('sortMode').value;a.sort((x,y)=>m==='rating'?(+y.rating||0)-(+x.rating||0):m==='old'?(x.date||'9999').localeCompare(y.date||'9999'):(y.date||'').localeCompare(x.date||''));return a}function bookHtml(b){const s=statusOf(b),cv=b.coverUrl?'<img class="cover" src="'+esc(b.coverUrl)+'" referrerpolicy="no-referrer">':'<div class="cover-placeholder">📖</div>';return'<div class="book"><div class="book-layout">'+cv+'<div class="book-info"><div class="book-title">'+esc(b.title)+'</div><div class="author">'+esc(b.author||'著者未設定')+'</div><span class="reading-tag '+stClass(s)+'">'+stLabel(s)+'</span><div class="meta">'+fmt(b.date)+'</div><div class="stars">'+(+b.rating?'⭐'.repeat(+b.rating):'')+'</div>'+(b.note?'<div class="note">'+esc(b.note)+'</div>':'')+'<div class="book-actions"><button onclick="editBook('+b.id+')">✏️ 編集</button><button onclick="refreshCover('+b.id+')">表紙再取得</button><button onclick="chooseCover('+b.id+')">📷 表紙</button><button onclick="del('+b.id+')">削除</button></div>'+editHtml(b)+'</div></div></div>'}function editBook(id){editId=id;renderList()}function editHtml(b){if(editId!==b.id)return'';return'<div class="edit-panel"><label>読書状況</label><select id="es'+b.id+'"><option value="done" '+(statusOf(b)==='done'?'selected':'')+'>✅ 読了</option><option value="reading" '+(statusOf(b)==='reading'?'selected':'')+'>📖 読書中</option><option value="unread" '+(statusOf(b)==='unread'?'selected':'')+'>📚 未読・積読</option></select><label>読了日</label><input id="ed'+b.id+'" type="date" value="'+esc(b.date||'')+'"><label>評価</label><select id="er'+b.id+'">'+[0,5,4,3,2,1].map(n=>'<option value="'+n+'" '+(+b.rating===n?'selected':'')+'>'+(n?'⭐'.repeat(n):'評価なし')+'</option>').join('')+'</select><label>メモ</label><textarea id="en'+b.id+'">'+esc(b.note||'')+'</textarea><div class="edit-actions"><button class="save-edit" onclick="saveEdit('+b.id+')">保存</button><button onclick="editId=null;renderList()">戻る</button></div></div>'}function saveEdit(id){const a=books(),b=a.find(x=>x.id===id);b.status=E('es'+id).value;b.date=E('ed'+id).value;b.rating=+E('er'+id).value;b.note=E('en'+id).value;save(a);editId=null;render()}function renderList(){const a=filtered();E('count').textContent='表示 '+a.length+'冊';if(!a.length)return E('bookList').innerHTML='<div class="empty" style="color:#777">該当する本がありません。</div>';if(E('viewMode').value==='all')return E('bookList').innerHTML=a.map(bookHtml).join('');const g={};a.forEach(b=>(g[b.author||'著者未設定']??=[]).push(b));E('bookList').innerHTML=Object.keys(g).sort((a,b)=>a.localeCompare(b,'ja')).map((n,i)=>'<div class="author-shelf"><button class="author-head" data-group="g'+i+'"><b>📚 '+esc(n)+'</b><span>'+g[n].length+'冊⌄</span></button><div class="author-body" id="g'+i+'">'+g[n].map(bookHtml).join('')+'</div></div>').join('')}function render(){renderStudy();renderList()}function showBook(id){const b=books().find(x=>x.id===id);if(!b)return;const s=statusOf(b),cv=b.coverUrl?'<img class="dialog-cover" src="'+esc(b.coverUrl)+'" referrerpolicy="no-referrer">':'<div class="dialog-placeholder">📖</div>';E('bookDialogCard').innerHTML='<div class="dialog-top">'+cv+'<div><div class="book-title">'+esc(b.title)+'</div><div class="author">'+esc(b.author||'著者未設定')+'</div><span class="reading-tag '+stClass(s)+'">'+stLabel(s)+'</span><div class="meta">'+fmt(b.date)+'</div></div></div>'+(b.note?'<div class="note">'+esc(b.note)+'</div>':'')+'<button class="dialog-close" id="dc">書斎に戻る</button>';E('bookDialog').classList.add('show');E('dc').onclick=()=>E('bookDialog').classList.remove('show')}function openSheet(id){const s=E(id);s.classList.add('show');s.scrollTop=0;requestAnimationFrame(()=>s.scrollTop=0)}async function closeSheet(id){if(id==='addSheet'&&scanning)await stopScanner();E(id).classList.remove('show');E(id).scrollTop=0}function setStudy(x){studyFilter=x;currentShelf=0;renderStudy()}function thisYear(){const y=new Date().getFullYear();E('periodFrom').value=y+'-01-01';E('periodTo').value=y+'-12-31';E('statusFilter').value='done';renderList()}function clearFilters(){E('historySearch').value='';E('statusFilter').value='all';E('periodFrom').value='';E('periodTo').value='';renderList()}function external(){const t=E('title').value.trim();window.open('https://www.google.com/search?q='+encodeURIComponent((t?t+' ':'')+'ISBN'),'_blank','noopener')}
E('openAdd').onclick=()=>openSheet('addSheet');document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>closeSheet(b.dataset.close));E('scanButton').onclick=startScanner;E('stopButton').onclick=stopScanner;E('searchButton').onclick=searchIsbn;E('lookupIsbnButton').onclick=external;E('addButton').onclick=addBook;E('coverFileInput').onchange=manual;['historySearch','viewMode','sortMode','statusFilter','periodFrom','periodTo'].forEach(id=>E(id).addEventListener(id==='historySearch'?'input':'change',renderList));E('thisYearButton').onclick=thisYear;E('clearPeriodButton').onclick=clearFilters;E('thisYearQuick').onclick=()=>setStudy('year');E('readingQuick').onclick=()=>setStudy('reading');E('allQuick').onclick=()=>setStudy('all');E('organizeQuick').onclick=E('organizeNav').onclick=()=>openSheet('organizeSheet');E('readingNav').onclick=()=>setStudy('reading');E('allNav').onclick=()=>openSheet('organizeSheet');E('prevShelf').onclick=()=>scrollShelf(currentShelf-1);E('nextShelf').onclick=()=>scrollShelf(currentShelf+1);E('shelfDots').onclick=e=>{if(e.target.dataset.dot!==undefined)scrollShelf(+e.target.dataset.dot)};E('cabinetTrack').onclick=e=>{const b=e.target.closest('[data-book]');if(b)showBook(+b.dataset.book)};let scrollTimer;E('cabinetTrack').addEventListener('scroll',()=>{clearTimeout(scrollTimer);scrollTimer=setTimeout(()=>{const track=E('cabinetTrack'),w=track.clientWidth+14;currentShelf=Math.max(0,Math.round(track.scrollLeft/w));[...E('shelfDots').children].forEach((d,n)=>d.classList.toggle('active',n===currentShelf))},80)});E('bookList').onclick=e=>{const h=e.target.closest('[data-group]');if(h)E(h.dataset.group)?.classList.toggle('closed')};E('bookDialog').onclick=e=>{if(e.target===E('bookDialog'))E('bookDialog').classList.remove('show')};today();render();
