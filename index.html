<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>わたしの書斎</title><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;background:#100c09;color:#f7ecd8}button,input,select,textarea{font:inherit}button{border:0}.study{min-height:100vh;background:radial-gradient(circle at 50% 0,#55351f 0,#24170f 28%,#110d0a 68%);padding-bottom:100px}.top{position:sticky;top:0;z-index:10;padding:calc(15px + env(safe-area-inset-top)) 18px 14px;background:linear-gradient(#130e0beF,#130e0bc9);backdrop-filter:blur(12px);border-bottom:1px solid #c9985b33}.top h1{font-family:Georgia,"Yu Mincho",serif;text-align:center;font-size:25px;letter-spacing:.08em;margin:0;color:#fff4d8;text-shadow:0 2px 8px #000}.top .sub{text-align:center;color:#c8a974;font-family:Georgia,serif;font-size:12px;margin-top:3px}.version{position:absolute;right:12px;bottom:5px;font-size:9px;color:#9f825e}.study-main{max-width:700px;margin:auto;padding:18px 14px}.summary{display:flex;justify-content:space-around;background:#1c140f;border:1px solid #b8874d44;border-radius:16px;padding:12px 6px;margin-bottom:14px;box-shadow:inset 0 1px #fff1}.stat{text-align:center}.stat b{display:block;font-family:Georgia,serif;font-size:21px;color:#e8c789}.stat span{font-size:10px;color:#aa9479}.library-frame{padding:12px 10px 0;border:8px solid #4b2b18;border-radius:12px;background:linear-gradient(90deg,#3a2114,#704527 9%,#472918 20%,#674021 48%,#412517 80%,#704527 92%,#351e12);box-shadow:inset 0 0 35px #0009,0 14px 30px #0008;border-top-color:#6d4326}.shelf-heading{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 11px;color:#ead4ae}.shelf-heading strong{font-family:Georgia,"Yu Mincho",serif}.shelf-heading small{color:#bda27e}.shelf-row{display:flex;align-items:flex-end;gap:3px;min-height:155px;overflow-x:auto;padding:7px 5px 0;background:radial-gradient(ellipse at top,#6c472a66,#1e110b99 70%)}.spine{position:relative;flex:0 0 34px;height:138px;border:1px solid #21150f;border-bottom:0;border-radius:3px 3px 0 0;padding:7px 4px;color:#f5ead7;background:linear-gradient(90deg,#52392c,#94704f 20%,#79583d 80%,#432d23);box-shadow:inset 2px 0 #fff1,inset -2px 0 #0004,2px 1px 4px #0008;writing-mode:vertical-rl;text-orientation:mixed;font-size:11px;font-weight:700;line-height:1.25;overflow:hidden}.spine:nth-child(5n+2){height:145px;background:linear-gradient(90deg,#263b32,#637765 20%,#485e50 80%,#21342b)}.spine:nth-child(5n+3){height:131px;background:linear-gradient(90deg,#2e3446,#687087 20%,#4e576d 80%,#292e3d)}.spine:nth-child(5n+4){height:142px;background:linear-gradient(90deg,#694528,#b38251 20%,#93663e 80%,#58371f)}.spine:nth-child(5n){height:135px;background:linear-gradient(90deg,#552d2d,#965958 20%,#794241 80%,#482526)}.spine.reading-spine:after{content:'🔖';position:absolute;bottom:5px;left:6px;writing-mode:horizontal-tb;font-size:12px}.spine.unread-spine{filter:saturate(.5) brightness(.8)}.plank{height:20px;margin:0 -10px 15px;background:linear-gradient(#a56b3d,#5e361f 50%,#321b10);border-top:2px solid #c18b58;box-shadow:0 7px 10px #0009}.empty{padding:55px 15px;text-align:center;color:#b99d78}.desk{margin:16px 0 0;padding:15px;background:linear-gradient(135deg,#251810,#17100c);border:1px solid #ad7c4344;border-radius:14px;box-shadow:inset 0 1px #fff1}.desk-title{font-family:Georgia,"Yu Mincho",serif;color:#e8c789;font-size:15px;margin-bottom:9px}.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px}.quick button{padding:11px 8px;border-radius:10px;background:#332318;color:#dec59e;border:1px solid #9d744644;font-size:12px}.bottom{position:fixed;z-index:20;bottom:0;left:0;right:0;padding:8px 14px calc(8px + env(safe-area-inset-bottom));background:#120d0aeF;backdrop-filter:blur(16px);border-top:1px solid #c9985b33;display:flex;justify-content:center;gap:10px}.bottom button{min-width:0;flex:1;max-width:160px;border-radius:14px;padding:10px 5px;background:transparent;color:#bca78c;font-size:11px}.bottom .add{flex:0 0 62px;height:62px;margin-top:-27px;border-radius:50%;font-size:31px;color:#fff3d6;background:radial-gradient(circle at 35% 30%,#d9aa66,#95612d 65%,#5d361c);border:2px solid #e0b876;box-shadow:0 5px 20px #000b,0 0 15px #c9954a66}.bottom .active{color:#f1ce91}.bottom .ico{display:block;font-size:20px;margin-bottom:2px}.sheet{display:none;position:fixed;inset:0;z-index:40;background:#000a;align-items:flex-start;justify-content:center;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:max(10px,env(safe-area-inset-top)) 8px calc(12px + env(safe-area-inset-bottom))}.sheet.show{display:flex}.sheet-card{width:min(700px,100%);max-height:none;overflow:visible;background:#f7f3eb;color:#29231e;border-radius:22px;padding:14px 18px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -12px 40px #0008;margin:0 auto}.sheet-head{position:sticky;top:0;background:#f7f3ebf2;backdrop-filter:blur(10px);z-index:3;display:flex;justify-content:space-between;align-items:center;padding:10px 0 12px}.sheet-head h2{margin:0;font-family:Georgia,"Yu Mincho",serif;font-size:21px}.close{width:36px;height:36px;border-radius:50%;background:#e8e2d9;color:#51483e;font-size:20px}.section{padding:13px 0;border-top:1px solid #e3dcd2}.section:first-of-type{border:0}.sheet label{display:block;font-weight:650;margin:11px 0 5px;font-size:13px}.sheet input,.sheet select,.sheet textarea{width:100%;padding:12px;border:1px solid #d4ccc1;border-radius:11px;background:#fff;font-size:16px}.sheet textarea{min-height:75px}.scan,.primary{width:100%;padding:13px;border-radius:12px;color:#fff;margin-top:7px;font-weight:700}.scan{background:#526b58}.primary{background:#30251d}.search-row{display:flex;gap:7px}.search-row input{flex:1}.search-row button{border-radius:11px;background:#e9e3da;padding:0 15px}.external{width:100%;padding:10px;border-radius:11px;background:#efe9df;color:#6d563c;margin-top:8px}.status{display:none;margin-top:9px;padding:10px;border-radius:10px;font-size:13px}.status.show{display:block}.info{background:#eaf0f8;color:#315e91}.ok{background:#e5f3e8;color:#326344}.error{background:#fae8e8;color:#993f3f}#scannerWrap{display:none;margin-top:10px}#reader{width:100%;background:#111;border-radius:12px;overflow:hidden}.stop{width:100%;padding:10px;border-radius:10px;margin-top:7px;background:#e8e2d9}.organize-grid{display:grid;gap:8px}.period{display:grid;grid-template-columns:1fr 1fr;gap:7px}.filter-actions{display:flex;gap:7px;margin-top:9px}.filter-actions button{flex:1;padding:10px;border-radius:10px;background:#e9e3da}.book{border-top:1px solid #e6ded3;padding:14px 0}.book-layout{display:flex;gap:12px}.cover,.cover-placeholder{width:68px;min-width:68px;height:102px;border-radius:6px;background:#e8e3dc}.cover{object-fit:cover}.cover-placeholder{display:flex;align-items:center;justify-content:center;font-size:25px}.book-info{min-width:0;flex:1}.book-title{font-weight:750;font-size:17px}.author,.meta{color:#776e64;font-size:13px;margin-top:4px}.reading-tag{display:inline-block;margin-top:6px;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:700}.reading{background:#fff0d0;color:#855b16}.done{background:#e4f0e7;color:#386248}.unread{background:#e9e9e9;color:#666}.stars{margin-top:4px}.note{margin-top:8px;font-size:13px;white-space:pre-wrap}.book-actions button{margin:8px 5px 0 0;padding:8px;border-radius:9px;font-size:11px;background:#eae5dd}.book-actions .delete{color:#8e3b3b}.edit-panel{margin-top:10px;padding:10px;background:#eee9e2;border-radius:10px}.edit-actions{display:flex;gap:7px;margin-top:8px}.edit-actions button{flex:1;padding:9px;border-radius:9px}.save-edit{background:#30251d!important;color:#fff}.author-shelf{border:1px solid #ddd5ca;border-radius:12px;margin:9px 0;overflow:hidden}.author-head{width:100%;display:flex;justify-content:space-between;padding:12px;background:#eee8df}.author-body{padding:0 12px}.author-body.closed{display:none}.dialog{display:none;position:fixed;inset:0;z-index:60;background:#000b;padding:20px;align-items:center;justify-content:center}.dialog.show{display:flex}.dialog-card{width:min(420px,100%);max-height:84vh;overflow:auto;background:#f8f3e9;color:#29231e;border-radius:18px;padding:17px}.dialog-top{display:flex;gap:13px}.dialog-cover,.dialog-placeholder{width:88px;height:132px;border-radius:6px;background:#e8e3dc}.dialog-cover{object-fit:cover}.dialog-placeholder{display:flex;align-items:center;justify-content:center;font-size:28px}.dialog-close{width:100%;padding:11px;margin-top:14px;border-radius:11px;background:#30251d;color:#fff}@media(min-width:600px){.shelf-row{min-height:180px}.spine{width:39px;height:158px}.spine:nth-child(5n+2){height:166px}.spine:nth-child(5n+3){height:151px}.spine:nth-child(5n+4){height:162px}.spine:nth-child(5n){height:155px}}</style></head><body><div class="study"><header class="top"><h1>わたしの書斎</h1><div class="sub">Good Books, Better Days</div><span class="version">書斎モード v22.1</span></header><main class="study-main"><div id="summary" class="summary"></div><div class="library-frame"><div class="shelf-heading"><strong>My Library</strong><small id="shelfCaption">すべての本</small></div><div id="studyShelf"></div></div><div class="desk"><div class="desk-title">☕ 書斎のメニュー</div><div class="quick"><button id="thisYearQuick">📅 今年読んだ本</button><button id="readingQuick">🔖 読書中の本</button><button id="allQuick">📚 すべての本</button><button id="organizeQuick">⚙️ 本棚を整理</button></div></div></main><nav class="bottom"><button class="active" id="shelfNav"><span class="ico">▥</span>書斎</button><button id="organizeNav"><span class="ico">⌕</span>整理</button><button class="add" id="openAdd">＋</button><button id="readingNav"><span class="ico">🔖</span>読書中</button><button id="allNav"><span class="ico">☰</span>一覧</button></nav></div><div class="sheet" id="addSheet"><div class="sheet-card"><div class="sheet-head"><h2>本を追加する</h2><button class="close" data-close="addSheet">×</button></div><div class="section"><button class="scan" id="scanButton">📷 本のバーコードを読み取る</button><div id="scannerWrap"><div id="reader"></div><button class="stop" id="stopButton">カメラを閉じる</button></div><label>ISBNを直接入力</label><div class="search-row"><input id="isbn" inputmode="numeric" placeholder="9784478025819"><button id="searchButton">検索</button></div><button class="external" id="lookupIsbnButton">🔎 手元にない本のISBNを調べる</button><div id="status" class="status"></div></div><div class="section"><label>書籍名</label><input id="title"><label>著者名</label><input id="author"><input id="coverUrl" type="hidden"><input id="publisher" type="hidden"><label>読書状況</label><select id="readingStatus"><option value="done">✅ 読了</option><option value="reading">📖 読書中</option><option value="unread">📚 未読・積読</option></select><label>読了日</label><input id="date" type="date"><label>評価</label><select id="rating"><option value="0">評価なし</option><option value="5">⭐⭐⭐⭐⭐</option><option value="4">⭐⭐⭐⭐</option><option value="3">⭐⭐⭐</option><option value="2">⭐⭐</option><option value="1">⭐</option></select><label>感想・メモ</label><textarea id="note"></textarea><button class="primary" id="addButton">＋ 本棚に追加する</button></div></div></div><div class="sheet" id="organizeSheet"><div class="sheet-card"><div class="sheet-head"><h2>本棚を整理する</h2><button class="close" data-close="organizeSheet">×</button></div><div class="section organize-grid"><input id="historySearch" placeholder="🔎 タイトル・著者で検索"><select id="viewMode"><option value="author">著者別</option><option value="all">すべての本</option></select><select id="sortMode"><option value="new">読了日：新しい順</option><option value="old">読了日：古い順</option><option value="rating">評価：高い順</option></select><select id="statusFilter"><option value="all">読書状況：すべて</option><option value="reading">📖 読書中だけ</option><option value="unread">📚 未読・積読だけ</option><option value="done">✅ 読了だけ</option></select><label>読了期間</label><div class="period"><input id="periodFrom" type="date"><input id="periodTo" type="date"></div><div class="filter-actions"><button id="thisYearButton">今年</button><button id="clearPeriodButton">条件を解除</button></div></div><div id="count" class="meta"></div><div id="bookList"></div></div></div><input id="coverFileInput" type="file" accept="image/*" hidden><div class="dialog" id="bookDialog"><div class="dialog-card" id="bookDialogCard"></div></div><script>const STORAGE_KEY='reading_history_v1';let html5QrCode=null,scanning=false,scanLocked=false,manualCoverBookId=null,editingBookId=null,studyFilter='all';const el=id=>document.getElementById(id),getBooks=()=>{try{return JSON.parse(localStorage.getItem(STORAGE_KEY))||[]}catch{return[]}},saveBooks=v=>localStorage.setItem(STORAGE_KEY,JSON.stringify(v));function setToday(){const d=new Date();el('date').value=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function normalizeIsbn(v){return String(v||'').replace(/[^0-9Xx]/g,'').toUpperCase()}function isValidIsbn13(x){if(!/^\d{13}$/.test(x))return false;let s=0;for(let i=0;i<12;i++)s+=+x[i]*(i%2?3:1);return(10-s%10)%10===+x[12]}function showStatus(m,t='info'){const s=el('status');s.textContent=m;s.className='status show '+t}function cleanAuthor(a){return String(a||'').replace(/,\d{4}-?/g,'').replace(/,/g,'').trim().replace(/\s+/g,'・')}function cleanUrl(u){return String(u||'').replace(/^http:/,'https:').replace(/&edge=curl/g,'')}function itemIsExactIsbn(item,isbn){return(item?.volumeInfo?.industryIdentifiers||[]).some(x=>normalizeIsbn(x.identifier)===isbn)}function bookStatus(b){return b.status||'done'}function statusLabel(v){return v==='reading'?'📖 読書中':v==='unread'?'📚 未読・積読':'✅ 読了'}function statusClass(v){return v==='reading'?'reading':v==='unread'?'unread':'done'}function imageWorks(url){return new Promise(resolve=>{if(!url)return resolve(false);let done=false;const img=new Image(),finish=v=>{if(done)return;done=true;clearTimeout(timer);img.onload=img.onerror=null;resolve(v)},timer=setTimeout(()=>finish(false),6000);img.referrerPolicy='no-referrer';img.onload=()=>finish(img.naturalWidth>=40&&img.naturalHeight>=60);img.onerror=()=>finish(false);img.src=url})}function itemCoverUrls(item){const l=item?.volumeInfo?.imageLinks||{};return[l.extraLarge,l.large,l.medium,l.small,l.thumbnail,l.smallThumbnail].filter(Boolean).map(cleanUrl)}function publisherCandidates(isbn,publisher){const out=[];if(!isbn)return out;if(/ダイヤモンド社/.test(String(publisher||'')))out.push('https://www.diamond.co.jp/images/book/'+isbn.slice(-1)+'/'+isbn+'.jpg');return out}async function googleExact(isbn){const out=[];for(const url of['https://www.googleapis.com/books/v1/volumes?q=isbn:'+isbn+'&langRestrict=ja&maxResults=20','https://www.googleapis.com/books/v1/volumes?q=isbn:'+isbn+'&maxResults=20'])try{const r=await fetch(url),d=await r.json();for(const i of d.items||[])if(itemIsExactIsbn(i,isbn))out.push(...itemCoverUrls(i))}catch{}return[...new Set(out)]}async function googleMetadata(isbn){for(const url of['https://www.googleapis.com/books/v1/volumes?q=isbn:'+isbn+'&langRestrict=ja&maxResults=20','https://www.googleapis.com/books/v1/volumes?q=isbn:'+isbn+'&maxResults=20'])try{const r=await fetch(url),d=await r.json();for(const i of d.items||[]){if(!itemIsExactIsbn(i,isbn))continue;const v=i.volumeInfo||{};if(v.title)return{title:v.title,author:(v.authors||[]).join('・'),publisher:v.publisher||'',cover:itemCoverUrls(i)[0]||''}}}catch{}return null}async function openLibrary(isbn){const out=[];try{const r=await fetch('https://openlibrary.org/search.json?isbn='+isbn+'&fields=cover_i,isbn&limit=10'),d=await r.json();for(const x of d.docs||[]){if(!(x.isbn||[]).some(v=>normalizeIsbn(v)===isbn))continue;if(x.cover_i)out.push('https://covers.openlibrary.org/b/id/'+x.cover_i+'-L.jpg?default=false')}}catch{}return out}async function findCover(isbn,preferred,title,author,publisher){let c=[...publisherCandidates(isbn,publisher)];if(preferred)c.push(cleanUrl(preferred));c.push(...await googleExact(isbn));c.push(...await openLibrary(isbn));c=[...new Set(c.filter(Boolean))];for(const u of c)if(await imageWorks(u))return u;return''}async function startScanner(){if(scanning)return;showStatus('カメラを起動しています…');el('scannerWrap').style.display='block';try{html5QrCode=new Html5Qrcode('reader',{formatsToSupport:[Html5QrcodeSupportedFormats.EAN_13]});await html5QrCode.start({facingMode:'environment'},{fps:10,qrbox:{width:280,height:120}},onScanSuccess,()=>{});scanning=true;scanLocked=false;showStatus('カメラ起動OK！ISBNバーコードを合わせてください。','ok')}catch{scanning=false;el('scannerWrap').style.display='none';showStatus('カメラを起動できませんでした。','error')}}async function stopScanner(){if(html5QrCode)try{if(scanning)await html5QrCode.stop();await html5QrCode.clear()}catch{}html5QrCode=null;scanning=false;scanLocked=false;el('scannerWrap').style.display='none'}async function onScanSuccess(text){if(scanLocked)return;const isbn=normalizeIsbn(text);if(!/^(978|979)\d{10}$/.test(isbn)||!isValidIsbn13(isbn))return;scanLocked=true;el('isbn').value=isbn;await stopScanner();await lookupBook(isbn)}async function searchByIsbn(){const isbn=normalizeIsbn(el('isbn').value);el('isbn').value=isbn;if(!isValidIsbn13(isbn))return showStatus('正しい13桁のISBNを入力してください。','error');await lookupBook(isbn)}async function lookupBook(isbn){showStatus('日本版の書籍情報と表紙を探しています…');try{const r=await fetch('https://api.openbd.jp/v1/get?isbn='+isbn),d=await r.json(),b=d?.[0];if(b?.summary?.title){const s=b.summary,a=cleanAuthor(s.author),p=s.publisher||'',c=await findCover(isbn,s.cover,s.title,a,p);fillBookInfo(isbn,s.title,a,c,p);showStatus(c?'書籍情報と表紙を取得しました！':'書籍情報を取得しました。表紙は見つかりませんでした。',c?'ok':'info');return}}catch{}const g=await googleMetadata(isbn);if(g){const a=cleanAuthor(g.author),c=await findCover(isbn,g.cover,g.title,a,g.publisher);fillBookInfo(isbn,g.title,a,c,g.publisher);showStatus(c?'書籍情報と表紙を取得しました！':'書籍情報を取得しました。表紙は見つかりませんでした。',c?'ok':'info');return}showStatus('書籍情報を自動取得できませんでした。','error')}function fillBookInfo(i,t,a,c,p){el('isbn').value=i;el('title').value=t||'';el('author').value=a||'';el('coverUrl').value=c||'';el('publisher').value=p||''}function addBook(){const title=el('title').value.trim();if(!title)return alert('書籍名を入力してください。');const books=getBooks();books.unshift({id:Date.now(),isbn:normalizeIsbn(el('isbn').value),title,author:el('author').value.trim(),publisher:el('publisher').value.trim(),status:el('readingStatus').value,date:el('date').value,rating:+el('rating').value,note:el('note').value.trim(),coverUrl:el('coverUrl').value});saveBooks(books);['isbn','title','author','note','coverUrl','publisher'].forEach(x=>el(x).value='');el('readingStatus').value='done';el('rating').value='0';setToday();renderAll();closeSheet('addSheet');setTimeout(()=>alert('📚 新しい本が書斎に加わりました！'),100)}function deleteBook(id){if(confirm('この本を削除しますか？')){saveBooks(getBooks().filter(b=>b.id!==id));renderAll()}}async function getPublisher(b){if(b.publisher)return b.publisher;try{const r=await fetch('https://api.openbd.jp/v1/get?isbn='+b.isbn),d=await r.json();return d?.[0]?.summary?.publisher||''}catch{return''}}async function refreshCover(id){const books=getBooks(),b=books.find(x=>x.id===id);if(!b)return;b.publisher=await getPublisher(b);b.coverUrl=await findCover(b.isbn,'',b.title,b.author,b.publisher);saveBooks(books);renderAll()}function chooseManualCover(id){manualCoverBookId=id;el('coverFileInput').value='';el('coverFileInput').click()}function resizeImageFile(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const scale=Math.min(1,500/img.width,750/img.height),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.8))};img.onerror=rej;img.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}async function handleManualCoverFile(e){const f=e.target.files?.[0];if(!f||manualCoverBookId==null)return;try{const data=await resizeImageFile(f),books=getBooks(),b=books.find(x=>x.id===manualCoverBookId);if(b){b.coverUrl=data;saveBooks(books);renderAll()}}catch{}manualCoverBookId=null}function startEdit(id){editingBookId=id;renderList()}function cancelEdit(){editingBookId=null;renderList()}function saveEdit(id){const books=getBooks(),b=books.find(x=>x.id===id);if(!b)return;b.status=el('editStatus'+id).value;b.date=el('editDate'+id).value;b.rating=+el('editRating'+id).value;b.note=el('editNote'+id).value.trim();saveBooks(books);editingBookId=null;renderAll()}function esc(t){return String(t||'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}function formatDate(d){if(!d)return'読了日未設定';const p=d.split('-');return p[0]+'年'+Number(p[1])+'月'+Number(p[2])+'日'}function ratingOptions(b){let s='';for(const n of[0,5,4,3,2,1])s+='<option value="'+n+'"'+(+b.rating===n?' selected':'')+'>'+(n?'⭐'.repeat(n):'評価なし')+'</option>';return s}function readingOptions(b){const v=bookStatus(b);return'<option value="done"'+(v==='done'?' selected':'')+'>✅ 読了</option><option value="reading"'+(v==='reading'?' selected':'')+'>📖 読書中</option><option value="unread"'+(v==='unread'?' selected':'')+'>📚 未読・積読</option>'}function coverHtml(b){return b.coverUrl?'<img class="cover" referrerpolicy="no-referrer" src="'+esc(b.coverUrl)+'" alt="表紙">':'<div class="cover-placeholder">📖</div>'}function editHtml(b){if(editingBookId!==b.id)return'';return'<div class="edit-panel"><label>読書状況</label><select id="editStatus'+b.id+'">'+readingOptions(b)+'</select><label>読了日</label><input id="editDate'+b.id+'" type="date" value="'+esc(b.date||'')+'"><label>評価</label><select id="editRating'+b.id+'">'+ratingOptions(b)+'</select><label>メモ</label><textarea id="editNote'+b.id+'">'+esc(b.note||'')+'</textarea><div class="edit-actions"><button class="save-edit" onclick="saveEdit('+b.id+')">保存</button><button onclic iv class="shelf-row">'+a.map(spineHtml).join('')+'</div><div class="plank"></div>')}el('studyShelf').innerHTML=parts.join('')}function periodMatch(b){const f=el('periodFrom').value,t=el('periodTo').value;if(!f&&!t)return true;if(bookStatus(b)!=='done'||!b.date)return false;return(!f||b.date>=f)&&(!t||b.date<=t)}function filteredBooks(){const q=el('historySearch').value.trim().toLowerCase(),sf=el('statusFilter').value;let a=getBooks().filter(b=>(!q||[b.title,b.author,b.isbn].some(v=>String(v||'').toLowerCase().includes(q)))&&(sf==='all'||bookStatus(b)===sf)&&periodMatch(b));const m=el('sortMode').value;a.sort((x,y)=>m==='rating'?(+y.rating||0)-(+x.rating||0):m==='old'?(x.date||'9999').localeCompare(y.date||'9999'):(y.date||'').localeCompare(x.date||''));return a}function renderList(){const all=getBooks(),books=filteredBooks();el('count').textContent='蔵書 '+all.length+'冊'+(books.length!==all.length?' ／ 表示 '+books.length+'冊':'');if(!books.length){el('bookList').innerHTML='<div class="empty" style="color:#777">該当する本がありません。</div>';return}if(el('viewMode').value==='all'){el('bookList').innerHTML=books.map(bookHtml).join('');return}const g={};books.forEach(b=>(g[(b.author||'').trim()||'著者未設定']??=[]).push(b));el('bookList').innerHTML=Object.keys(g).sort((a,b)=>a.localeCompare(b,'ja')).map((n,i)=>'<div class="author-shelf"><button class="author-head" data-author-target="ag'+i+'"><b>📚 '+esc(n)+'</b><span>'+g[n].length+'冊⌄</span></button><div class="author-body" id="ag'+i+'">'+g[n].map(bookHtml).join('')+'</div></div>').join('')}function renderAll(){renderStudy();renderList()}function showBookDialog(id){const b=getBooks().find(x=>x.id===id);if(!b)return;const st=bookStatus(b),cv=b.coverUrl?'<img class="dialog-cover" referrerpolicy="no-referrer" src="'+esc(b.coverUrl)+'">':'<div class="dialog-placeholder">📖</div>';el('bookDialogCard').innerHTML='<div class="dialog-top">'+cv+'<div class="book-info"><div class="book-title">'+esc(b.title)+'</div><div class="author">'+esc(b.author||'著者未設定')+'</div><span class="reading-tag '+statusClass(st)+'">'+statusLabel(st)+'</span><div class="meta">'+formatDate(b.date)+'</div><div class="stars">'+(+b.rating?'⭐'.repeat(+b.rating):'評価なし')+'</div></div></div>'+(b.note?'<div class="note">'+esc(b.note)+'</div>':'')+'<button class="dialog-close" id="dialogClose">書斎に戻る</button>';el('bookDialog').classList.add('show');el('dialogClose').onclick=()=>el('bookDialog').classList.remove('show')}function openSheet(id){el(id).classList.add('show')}async function closeSheet(id){if(id==='addSheet'&&scanning)await stopScanner();el(id).classList.remove('show')}function setStudyFilter(f){studyFilter=f;renderStudy()}function setThisYearList(){const y=new Date().getFullYear();el('periodFrom').value=y+'-01-01';el('periodTo').value=y+'-12-31';el('statusFilter').value='done';renderList()}function clearFilters(){el('historySearch').value='';el('statusFilter').value='all';el('periodFrom').value='';el('periodTo').value='';renderList()}function lookupIsbnExternally(){const t=el('title').value.trim(),q=t?t+' ISBN':'書籍 ISBN 検索';window.open('https://www.google.com/search?q='+encodeURIComponent(q),'_blank','noopener')}el('openAdd').onclick=()=>openSheet('addSheet');document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>closeSheet(b.dataset.close));el('scanButton').onclick=startScanner;el('stopButton').onclick=stopScanner;el('searchButton').onclick=searchByIsbn;el('lookupIsbnButton').onclick=lookupIsbnExternally;el('addButton').onclick=addBook;el('coverFileInput').onchange=handleManualCoverFile;['historySearch','viewMode','sortMode','statusFilter','periodFrom','periodTo'].forEach(id=>el(id).addEventListener(id==='historySearch'?'input':'change',renderList));el('thisYearButton').onclick=setThisYearList;el('clearPeriodButton').onclick=clearFilters;el('thisYearQuick').onclick=()=>setStudyFilter('year');el('readingQuick').onclick=()=>setStudyFilter('reading');el('allQuick').onclick=()=>setStudyFilter('all');el('organizeQuick').onclick=()=>openSheet('organizeSheet');el('organizeNav').onclick=()=>openSheet('organizeSheet');el('readingNav').onclick=()=>setStudyFilter('reading');el('allNav').onclick=()=>openSheet('organizeSheet');el('studyShelf').onclick=e=>{const s=e.target.closest('[data-book-id]');if(s)showBookDialog(+s.dataset.bookId)};el('bookList').onclick=e=>{const h=e.target.closest('[data-author-target]');if(h)el(h.dataset.authorTarget)?.classList.toggle('closed')};el('bookDialog').onclick=e=>{if(e.target===el('bookDialog'))el('bookDialog').classList.remove('show')};setToday();renderAll();</script></body></html>
