<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>表紙診断 v2</title><style>body{margin:0;background:#f5f5f7;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;color:#222}main{max-width:680px;margin:auto;padding:18px}.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 2px 8px #0000000f}h1{font-size:24px;margin:0 0 8px}.sub{color:#666;font-size:14px;line-height:1.5}input,button{width:100%;font-size:16px;padding:13px;border-radius:10px;box-sizing:border-box}input{border:1px solid #ccc;margin:8px 0}button{border:0;background:#2f6fed;color:#fff;font-weight:700;margin-top:8px}.test{margin-top:14px;padding-top:14px;border-top:1px solid #eee}.label{font-weight:700}.url{font-size:12px;word-break:break-all;color:#666;background:#f5f5f7;padding:8px;border-radius:8px;margin-top:6px}.result{margin-top:8px;padding:10px;border-radius:9px;font-size:14px}.wait{background:#eef4ff;color:#2457b8}.ok{background:#edf8f0;color:#23663a}.ng{background:#fff0f0;color:#a23636}.preview{display:block;max-width:180px;max-height:260px;margin:12px auto 0;border-radius:8px}.link{display:block;text-align:center;margin-top:10px;color:#2457b8;font-weight:600}</style></head><body><main><div class="card"><h1>🧪 表紙画像 診断 v2</h1><div class="sub">403になったBooks.or.jpは外し、別の取得元をテストします。読書履歴データやカメラには触れません。</div><label>ISBN</label><input id="isbn" inputmode="numeric" value="9784534061119"><button id="run">このISBNを診断する</button></div><div class="card" id="results"></div></main><script>
const $=id=>document.getElementById(id);function norm(v){return String(v||'').replace(/\D/g,'')}
function testBlock(id,title,url){return `<div class="test"><div class="label">${title}</div><div class="url">${url}</div><div id="${id}" class="result wait">読み込み中…</div><img id="${id}img" class="preview" style="display:none"><a class="link" href="${url}" target="_blank" rel="noopener noreferrer">画像URLをSafariで直接開く</a></div>`}
function testOne(id,url){return new Promise(resolve=>{const box=$(id),img=$(id+'img');let done=false;const finish=(ok,msg)=>{if(done)return;done=true;clearTimeout(timer);box.className='result '+(ok?'ok':'ng');box.textContent=msg;if(ok)img.style.display='block';resolve(ok)},timer=setTimeout(()=>finish(false,'❌ 10秒以内に読み込めませんでした'),10000);img.referrerPolicy='no-referrer';img.onload=()=>finish(true,`✅ 読み込み成功（${img.naturalWidth}×${img.naturalHeight}px）`);img.onerror=()=>finish(false,'❌ 画像の読み込みエラー');img.src=url})}
async function run(){const isbn=norm($('isbn').value);if(isbn.length!==13){$('results').innerHTML='<div class="result ng">13桁のISBNを入力してください。</div>';return}const han=`https://img.hanmoto.com/bd/img/${isbn}_600.jpg`;const rak=`https://shop.r10s.jp/book/cabinet/${isbn.slice(-4)}/${isbn}_1_4.jpg`;const dia=`https://www.diamond.co.jp/images/book/${isbn.slice(-1)}/${isbn}.jpg`;$('results').innerHTML='<div class="sub">今回は版元ドットコムと楽天ブックス系画像を確認します。成功したものは、そのままアプリの新しい表紙候補にできます。</div>'+testBlock('han','① 版元ドットコム',han)+testBlock('rak','② 楽天ブックス画像',rak)+testBlock('dia','③ ダイヤモンド社（比較用）',dia);testOne('han',han);testOne('rak',rak);testOne('dia',dia)}$('run').onclick=run;run();</script></body></html>
